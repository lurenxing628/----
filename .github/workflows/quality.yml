name: quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      APS_CHROME_PATH: C:\Program Files\Google\Chrome\Application\chrome.exe
    steps:
      - name: 检出仓库
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: 安装 Python 3.8
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.8'

      - name: 安装 Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: 安装运行依赖
        run: python -m pip install -r requirements.txt

      - name: 安装开发依赖
        run: python -m pip install -r requirements-dev.txt

      - name: 执行统一质量门禁
        run: python scripts/run_quality_gate.py --require-clean-worktree

      - name: 上传 quality gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-gate-evidence
          path: evidence/QualityGate/
          if-no-files-found: warn
