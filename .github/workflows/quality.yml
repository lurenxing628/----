name: quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      APS_CHROME_PATH: C:\Program Files\Google\Chrome\Application\chrome.exe
    steps:
      - name: 检出仓库
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: 安装 Python 3.8
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.8'

      - name: 安装 Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: 安装运行依赖
        run: python -m pip install -r requirements.txt

      - name: 安装开发依赖
        run: python -m pip install -r requirements-dev.txt

      - name: 安装可选图分析依赖 (networkx)
        # 工序图分析默认开启 (DEFAULT_GRAPH_ANALYSIS_MODE='on')，需 networkx==3.1。
        # 镜像真实 Win7 装机要求：缺它则默认配置下调度器会抛“请先安装…”守卫，门禁随之转红。
        run: python -m pip install -r requirements-optimizer-lite-win7.txt

      - name: 验证 Chrome 路径
        shell: pwsh
        run: |
          if (-not (Test-Path $env:APS_CHROME_PATH)) {
            Write-Error "APS_CHROME_PATH does not exist: $env:APS_CHROME_PATH"
          }
          & $env:APS_CHROME_PATH --version

      - name: 恢复 long gate cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            evidence/QualityGate/long_gate/
            evidence/QualityGate/collect_nodeids.json
            evidence/QualityGate/current_full_test_debt.json
            evidence/QualityGate/full_test_debt_summary.json
            evidence/QualityGate/full_test_debt_node_cache.json
            evidence/QualityGate/architecture_scan_cache.json
            evidence/QualityGate/startup_runtime_regressions.json
            evidence/QualityGate/required_regressions.json
            evidence/QualityGate/required_regressions/
            evidence/QualityGate/debt_ledger_sync.json
            evidence/QualityGate/ruff_check_full.json
            evidence/QualityGate/pyright_gate_full.json
            evidence/QualityGate/pyright_tools_full.json
            evidence/QualityGate/quickref_vs_routes.md
          key: quality-long-gate-${{ runner.os }}-py38-deps-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'requirements-optimizer-lite-win7.txt') }}-tooling-${{ hashFiles('.github/workflows/quality.yml', '.pre-commit-config.yaml', 'scripts/run_quality_gate.py', 'scripts/run_daily_quality_gate.py', 'tools/**/*.py', 'pyrightconfig.gate.json', 'pyrightconfig.tools.json') }}-sha-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            quality-long-gate-${{ runner.os }}-py38-deps-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'requirements-optimizer-lite-win7.txt') }}-tooling-${{ hashFiles('.github/workflows/quality.yml', '.pre-commit-config.yaml', 'scripts/run_quality_gate.py', 'scripts/run_daily_quality_gate.py', 'tools/**/*.py', 'pyrightconfig.gate.json', 'pyrightconfig.tools.json') }}-

      - name: 执行统一质量门禁
        run: python scripts/run_quality_gate.py --require-clean-worktree --long-gate-cache

      - name: 保存 long gate cache
        if: ${{ success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            evidence/QualityGate/long_gate/
            evidence/QualityGate/collect_nodeids.json
            evidence/QualityGate/current_full_test_debt.json
            evidence/QualityGate/full_test_debt_summary.json
            evidence/QualityGate/full_test_debt_node_cache.json
            evidence/QualityGate/architecture_scan_cache.json
            evidence/QualityGate/startup_runtime_regressions.json
            evidence/QualityGate/required_regressions.json
            evidence/QualityGate/required_regressions/
            evidence/QualityGate/debt_ledger_sync.json
            evidence/QualityGate/ruff_check_full.json
            evidence/QualityGate/pyright_gate_full.json
            evidence/QualityGate/pyright_tools_full.json
            evidence/QualityGate/quickref_vs_routes.md
          key: quality-long-gate-${{ runner.os }}-py38-deps-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'requirements-optimizer-lite-win7.txt') }}-tooling-${{ hashFiles('.github/workflows/quality.yml', '.pre-commit-config.yaml', 'scripts/run_quality_gate.py', 'scripts/run_daily_quality_gate.py', 'tools/**/*.py', 'pyrightconfig.gate.json', 'pyrightconfig.tools.json') }}-sha-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 上传 quality gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-gate-evidence
          path: evidence/QualityGate/
          if-no-files-found: warn
