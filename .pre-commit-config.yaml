repos:
  # 说明：
  # - 使用本地 system hook，避免远端 hook 联网安装失败阻断提交
  # - 请先用当前解释器安装 requirements-dev.txt，再执行 `python -m pre_commit install`
  - repo: local
    hooks:
      - id: ruff
        name: ruff (system)
        entry: python -m ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python]
        stages: [pre-commit]
      - id: block-local-artifacts
        name: block local runtime/generated artifacts
        entry: python tools/git_hook_checks.py check-staged-artifacts
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: readable-commit-message
        name: readable commit message
        entry: python tools/git_hook_checks.py check-commit-msg
        language: system
        stages: [commit-msg]
      - id: aps-quality-gate
        name: APS quality gate before push
        entry: python tools/git_hook_checks.py run-quality-gate
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
