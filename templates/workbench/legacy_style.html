<style>
:root { color-scheme: light; --page:#f5f7fa; --surface:#ffffff; --text:#24272c; --muted:#68707b; --line:#dce1e7; --accent:#cf3348; --warning:#956700; }
:root[data-theme="dark"] { color-scheme:dark; --page:#191b20; --surface:#23262d; --text:#eff1f4; --muted:#afb6c2; --line:#3a404a; --accent:#ff7180; --warning:#efc86e; }
* { box-sizing:border-box; letter-spacing:0; }
body { margin:0; background:var(--page); color:var(--text); font:14px/1.6 "Microsoft YaHei","PingFang SC",sans-serif; }
main { max-width:1120px; padding:28px 24px 64px; margin:auto; min-width:0; }
header { border-bottom:1px solid var(--line); margin-bottom:20px; padding-bottom:14px; }
h1 { font-size:22px; line-height:1.4; margin:0 0 8px; overflow-wrap:anywhere; }
h2 { font-size:17px; margin:24px 0 12px; }
a { color:var(--accent); text-underline-offset:3px; }
button { font:inherit; padding:7px 15px; border:1px solid var(--line); border-radius:6px; cursor:pointer; background:var(--surface); color:var(--text); }
button[type="submit"] { background:var(--accent); color:var(--surface); border-color:var(--accent); }
button:disabled { opacity:.55; cursor:not-allowed; }
section { margin-top:20px; padding-top:16px; border-top:1px solid var(--line); }
dl { display:grid; grid-template-columns:minmax(100px,180px) minmax(0,1fr); gap:6px 18px; }
dt { color:var(--muted); } dd { margin:0; overflow-wrap:anywhere; }
.notice { border-left:3px solid var(--accent); padding:8px 12px; background:var(--surface); }
.notice[data-level="warning"] { border-color:var(--warning); }
.muted { color:var(--muted); }
.actions { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin:16px 0; }
.table-scroll { overflow:auto; max-width:100%; }
table { width:100%; border-collapse:collapse; background:var(--surface); }
th,td { border-bottom:1px solid var(--line); padding:9px 12px; text-align:left; vertical-align:top; overflow-wrap:anywhere; }
th { color:var(--muted); font-weight:500; }
pre { margin:8px 0; white-space:pre-wrap; overflow-wrap:anywhere; font:12px/1.6 monospace; }
h3 { font-size:15px; margin:20px 0 10px; } h4 { font-size:14px; margin:16px 0 8px; }
.manual-source p { margin:10px 0; }
.manual-source ul,.manual-source ol { margin:10px 0; padding-left:22px; }
.manual-source li { margin:4px 0; }
.manual-source code { padding:1px 4px; border:1px solid var(--line); border-radius:4px; font:12px/1.5 monospace; }
.manual-source blockquote { margin:12px 0; padding:8px 12px; border-left:3px solid var(--line); background:var(--surface); }
.manual-source hr { border:0; border-top:1px solid var(--line); margin:20px 0; }
.manual-table { overflow:auto; max-width:100%; margin:12px 0; }
.manual-table table { min-width:520px; }
.manual-table th,.manual-table td { border:1px solid var(--line); padding:7px 10px; }
.manual-code { padding:10px 12px; background:var(--surface); border:1px solid var(--line); border-radius:6px; }
.manual-outline { margin:16px 0; padding:12px 16px; background:var(--surface); border:1px solid var(--line); border-radius:6px; }
.manual-outline ul { margin:0; padding-left:20px; }
.manual-outline > ul { list-style:none; padding-left:0; }
.manual-outline > ul > li { margin:8px 0; }
.manual-outline ul ul { display:flex; flex-wrap:wrap; gap:6px 16px; list-style:none; padding:4px 0 0; }
.manual-outline ul ul a { font-size:13px; color:var(--muted); }
.confirmation { display:flex; gap:9px; align-items:flex-start; margin:16px 0; }
.preference-error { display:none; }
[data-preference-error="true"] .preference-error { display:block; }
@media(max-width:640px) { main { padding:20px 14px 40px; } dl { grid-template-columns:1fr; gap:2px; } dd { margin-bottom:10px; } }
@media print { body { background:#fff; color:#000; } .no-print { display:none!important; } main { max-width:none; margin:0; padding:0; } }
</style>
