  - wbfix-report-void
  - wbfix-export-delivery
  status: in-progress
  feature: null
  notes: 原主线/文件轨/51道跨页/视觉/处置及G3库存、G4批次维护、G5批删、G7独立导出均完成；G1草稿放弃完成，正向试调采用继续。G2/G6已回报成功待详细归档；231723备份按用户要求保留、删除未执行，不是阻塞。等试调正向与最终5000激活保留证明再收口；旧build/环境记录为历史阶段，不跑全门禁、未提交。
