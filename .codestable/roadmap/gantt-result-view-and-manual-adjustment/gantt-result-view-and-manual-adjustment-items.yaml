      - templates/scheduler/gantt.html
      - web_new_test/templates/scheduler/gantt.html
      - tests/regression_gantt_critical_outline_sync.py
    exit_checks:
      - 明确本地时间和自然日边界
      - 明确第一版缩放包含月/周/日/12小时/6小时/小时/15分钟/5分钟/1分钟
      - 明确只读模式不触发 date_change/progress_change 保存
      - 明确任务业务身份不只依赖 Frappe task.id
