  - slug: gantt-component-upgrade-spike
    title: 后续甘特组件升级评估
    description: 后续在 Win7 Chrome 109 与离线交付边界下评估继续 Frappe、封装 Frappe、替换 Bryntum/DHTMLX/Syncfusion 的真实成本。
