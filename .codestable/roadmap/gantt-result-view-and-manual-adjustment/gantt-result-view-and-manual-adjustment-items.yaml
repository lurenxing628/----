    minimal_loop: true
    primary_paths:
      - .codestable/roadmap/gantt-result-view-and-manual-adjustment/gantt-result-view-and-manual-adjustment-roadmap.md
      - .codestable/roadmap/gantt-result-view-and-manual-adjustment/gantt-result-view-and-manual-adjustment-items.yaml
      - .codestable/vendor/frappe-gantt-local-patches.md
