    notes: 第一版只读甘特图不产生任何保存、草稿、正式采用动作。

  - slug: gantt-readonly-result-mode
    title: 阶段 1 甘特图查看模式收口
    description: 把甘特图默认收成只读查看模式，禁掉无效拖动和拉伸，只保留点击详情、筛选、配色和关键工序查看。
    depends_on: [gantt-readonly-foundation-contract]
    status: done
    feature: 2026-05-22-gantt-readonly-docs-and-qa
    minimal_loop: true
    primary_paths:
      - templates/scheduler/gantt.html
      - web_new_test/templates/scheduler/gantt.html
      - static/js/gantt_render.js
      - static/js/frappe-gantt.min.js
      - static/css/aps_gantt.css
      - tests/regression_gantt_readonly_mode_contract.py
    exit_checks:
      - 甘特图页面显示“查看模式”提示
      - 设备视图和人员视图的条形图都不能拖动或拉伸
      - 只读模式不触发 date_change/progress_change
      - 点击条形图仍能打开详情弹窗并高亮批次
      - 筛选、配色、关键工序、工序关系线不退化
    notes: 不能做拖动保存，不能新增草稿接口，不能写 Schedule/ScheduleHistory。

  - slug: gantt-readonly-time-zoom
    title: 阶段 2 只读甘特图时间缩放
    description: 增加只读甘特图时间缩放，支持月、周、日、12小时、6小时、小时、15分钟、5分钟和1分钟查看，让短工序能看清具体小时分钟。
    depends_on: [gantt-readonly-result-mode]
    status: done
    feature: 2026-05-22-gantt-readonly-docs-and-qa
    minimal_loop: true
    primary_paths:
      - static/js/gantt_zoom.js
      - static/js/gantt_ui.js
      - static/js/gantt_render.js
      - static/js/frappe-gantt.min.js
      - templates/scheduler/gantt.html
      - web_new_test/templates/scheduler/gantt.html
      - tests/regression_gantt_zoom_contract.py
      - tests/regression_gantt_url_persistence.py
      - tests/regression_frappe_gantt_short_task_contract.py
    exit_checks:
      - 时间粒度支持 month/week/day/half-day/quarter-day/hour/fifteen-minute/five-minute/one-minute
      - 旧参数 gantt_vm=Day/Week/Month 仍能兼容
      - 缩放状态写入 gantt_zoom，复制链接可复现
      - 36分钟、51分钟、73分钟和跨天短工序在细粒度视图可见可点
      - 显式 00:00:00 结束的短工序不会被错误扩成整天
    notes: 只做查看缩放，不做拖动保存；当前主线不做秒级、0.1秒或精细模式。

  - slug: gantt-readonly-decoration-sync
    title: 阶段 3 缩放后的视觉标记对齐
    description: 缩放后同步短条点击区、假期/停工背景、今天高亮、关键工序外框、超期红框、外协虚线、依赖线和横向滚动定位。
    depends_on: [gantt-readonly-time-zoom]
    status: done
    feature: 2026-05-22-gantt-readonly-docs-and-qa
    minimal_loop: true
    primary_paths:
      - static/js/gantt_render.js
      - static/js/gantt_outline.js
      - static/js/frappe-gantt.min.js
      - tests/regression_gantt_zoom_decoration_sync.py
      - tests/regression_gantt_critical_outline_sync.py
    exit_checks:
      - bar 按真实时长显示
      - bar-hit 只扩大点击区域，不扩大真实条形
      - 假期/停工背景在缩放后仍对齐自然日
      - 今天高亮在缩放后仍对齐自然日
      - 关键工序外框跟随真实 bar，不跟随 bar-hit
      - 依赖线不出现 NaN
    notes: 视觉标记不能因为切到小时/分钟视图而错位。

  - slug: gantt-readonly-performance-guards
    title: 阶段 4 分钟级视图范围保护和性能压测
    description: 为小时和分钟级视图增加 max_range_days、列数和节点数保护，并沉淀 Win7 Chrome 109 浏览器压测步骤。
    depends_on: [gantt-readonly-decoration-sync]
    status: done
    feature: 2026-05-22-gantt-readonly-docs-and-qa
    minimal_loop: true
    primary_paths:
      - static/js/gantt_zoom.js
      - static/js/gantt_render.js
      - static/js/gantt_ui.js
      - templates/scheduler/gantt.html
      - web_new_test/templates/scheduler/gantt.html
      - static/css/aps_gantt.css
      - tests/regression_gantt_zoom_range_guard.py
      - docs/dev/aps-browser-scheduler-qa-replay.md
    exit_checks:
      - one-minute + 2天阻止渲染
      - five-minute + 4天阻止渲染
      - fifteen-minute + 8天阻止渲染
      - hour + 15天阻止渲染
      - estimated_nodes 超过 hard_node_limit 时阻止渲染
      - estimated_nodes 超过 soft_node_limit 但未超过 hard_node_limit 时显示性能提示
    notes: 第一版不做虚拟滚动，不换甘特组件。

