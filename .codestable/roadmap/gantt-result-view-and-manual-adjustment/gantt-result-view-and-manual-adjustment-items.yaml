      - evidence/
      - static/js/
    exit_checks:
      - 有 Win7 Chrome 109 或等价目标浏览器的 POC 证据
      - 对比 Frappe、Bryntum、DHTMLX、Syncfusion 的缩放、只读、拖动、依赖线、资源视图、性能、授权和离线部署
      - 只有 Frappe 明确撑不住时才提出替换建议
