  - slug: alns-selection-acceptance-trace
    description: 实现拆修搜索 operator 选择、threshold/Record-to-Record Travel/SA acceptance、segment 权重更新和 trace 输出
    depends_on: [alns-sgs-repair-adapter]
    status: planned
    feature: null
    minimal_loop: false
    notes: |-
      operator reward 只影响后续选择概率，不能直接覆盖 objective score。

      本项承载剪枝 trace、拒绝原因、operator reward 和算法归因边界，不实现剪枝规则本体。

      必填 trace：
      - pruning_trace
      - operator_selection_trace
      - acceptance_trace
      - reward_update_trace
      - candidate_rejection_trace

      PruningTraceEvent 字段：
      - schema_version
      - elapsed_ms
      - phase
      - operator_name
      - operator_version
      - rule_id
      - rule_version
      - decision: keep / prune / reject / skip_by_budget
      - reason
      - safety_status
      - objective_name
      - objective_compatibility
      - candidate_space_before
      - candidate_space_after
      - generated_candidates
      - evaluated_candidates
      - pruned_candidates
      - rejected_candidates
      - skipped_by_budget

      归因规则：
      - algorithm_profile 表示本轮运行的算法外壳，如 graph_ready / alns。
      - candidate_origin 表示候选来源，如 graph_ready_v2_generated / graph_ready_v2_repaired / alns。
      - operator_name 表示产生候选的算子。
      - selection_source 表示最终选择来自统一候选池、当前 best 或 posthoc portfolio。
      - posthoc portfolio best 只能写 portfolio_all / posthoc_upper_bound / not_comparable。
      - 单个 operator 只能获得“参与贡献”或 reward，不得把组合池最优偷归功给自己。
      - reward_update_trace 只能改变后续 operator 权重，不能改正式 score。

      public/diagnostics：
      - public 只展示聚合计数、中文摘要、安全状态和是否采纳。
      - diagnostics 可保留完整 trace，但不能进入普通页面、HTML、导出、OperationLogs public 投影。
      - raw op_id/resource_id/candidate_id/fingerprint hash 不得 public 暴露。

      测试验收：
      - reward 直接修改 objective score 时失败。
      - posthoc portfolio best 被归因到单一 operator 时失败。
      - 剪枝 trace 缺 rule_id/rule_version/safety_status 时失败。
      - reject reason 为空时失败。
      - public 投影出现 raw id/fingerprint hash 时失败。
