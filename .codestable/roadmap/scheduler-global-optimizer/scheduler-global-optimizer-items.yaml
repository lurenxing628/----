roadmap: scheduler-global-optimizer
created: 2026-06-26

items:
  - slug: optimizer-proof-harness
    description: 建立 tiny oracle、lower bound、best-known 和不写 tracked evidence 的 benchmark check 模式
    depends_on: []
    status: done
    feature: 2026-06-26-optimizer-proof-harness
    minimal_loop: true
    notes: 最小闭环；gap 必须绑定 objective 和 metric；public benchmark 输出不能含内部 id/sample

  - slug: diagnostic-public-id-boundary-fix
    description: 修复诊断页展示 op 节点、数字 op_id 和内部样本的 public 边界问题
    depends_on: []
    status: done
    feature: 2026-06-26-diagnostic-public-id-boundary-fix
    minimal_loop: true
    notes: Phase A；public algo/graph/candidate/export/OperationLogs 已收紧为白名单摘要；diagnostics 可保留内部调试但不得进入普通页面、HTML、导出、OperationLogs public 投影；新增 trace/attempt/move/benchmark 样本前必须继续复用该投影边界

  - slug: optimizer-search-report-contract
    description: 给 optimizer 增加 stop_reason、seed、搜索统计、候选拒绝原因和 trace 合同
    depends_on: [optimizer-proof-harness, diagnostic-public-id-boundary-fix]
    status: done
    feature: 2026-06-27-optimizer-search-report-contract
    minimal_loop: false
    notes: baseline fallback、multi-start、optional OR-Tools warm-start failure、candidate_rejected、local search skipped/noop、time_budget、iteration_limit、no_improvement 都进入 OptimizationSearchReport；public 只投安全摘要，raw attempts/fingerprint 留 diagnostics；完整 candidate profile 与完整 CandidateFingerprint 仍留给 item 4/5

  - slug: optimizer-candidate-profile-contract
    description: 定义非 OR-Tools 搜索 profile，收紧配置校验和非法参数 fail-loud 合同
    depends_on: [optimizer-search-report-contract]
    status: done
    feature: 2026-06-28-optimizer-candidate-profile-contract
    minimal_loop: false
    notes: 已落地 CandidateProfile 合同(core/services/scheduler/run/optimizer_candidate_profile.py)并接入 OptimizationSearchReport.candidate_profile；configured/effective time budget 与 max_iterations 区分、迭代 [200,5000] 系统钳制如实写 system_limit_applied/system_limit_reason/iteration_limit_source；derive_iteration_limits 作为迭代上限单一真相源,local search 改为共用(零行为变化);未知 profile/repair/acceptance/neighborhood 与非法 budget 一律 fail-loud(与 strict 无关);profile_public/profile_diagnostics 白名单分层 + size guard 最小摘要保留 profile_public;seed 如实标 version 派生。本阶段 profile 取值限 baseline/multi_start_local_search(§4.3 full enum 的 grasp/ig/vns/sa/alns 待 item 6-10 扩展,未知值仍 ValidationError);repair 仅 sgs、acceptance 仅 improve_only、neighborhoods 仅 swap/insert/block。未做 item 5 完整 CandidateFingerprint。

  - slug: distinct-candidate-fingerprint-contract
    description: 定义候选指纹、去重计数、same-fingerprint 拒绝和 improved 判定合同
    depends_on: [optimizer-candidate-profile-contract]
    status: planned
    feature: null
    minimal_loop: false
    notes: 防止重复顺序、重复解码结果或返回原方案被包装成不同候选或优化成功

  - slug: grasp-ig-candidate-construction
    description: 用 GRASP 和 Iterated Greedy 生成更多可行起点，仍由现有 SGS 落位
    depends_on: [distinct-candidate-fingerprint-contract]
    status: planned
    feature: null
    minimal_loop: false
    notes: Phase A 末项；可用后作为独立集成里程碑当即接回 OptimizationOutcome/候选比较，不等 item13 与 ALNS 一起大爆炸上线；目标是扩大起点空间；只生成 order/priority/rule 候选，不生成 ScheduleResult、start/end 或 mutable seed

  - slug: business-neighborhood-registry
    description: 建立关键链、延期批次、瓶颈设备、换型块、资源替换、时间窗 repair 的邻域注册表
    depends_on: [distinct-candidate-fingerprint-contract]
    status: planned
    feature: null
    minimal_loop: false
    notes: Phase B 入口；启动须先过 proof-harness 证据闸门(证明 GRASP/IG+现有 SGS 距 oracle/下界仍有值得填的显著 gap)，否则 Phase B 降为后续候选研究；邻域只描述 mutable scope 和 move reason；最终落位仍走 SGS 和 estimate_internal_slot，不提前写可变工序时间

  - slug: vns-sa-local-search-upgrade
    description: 把现有 local search 升级为 VNS 和 SA 后处理，先做轻量可复现版本
    depends_on: [grasp-ig-candidate-construction, business-neighborhood-registry]
    status: planned
    feature: null
    minimal_loop: false
    notes: 固定 seed、固定预算、明确 stop_reason；Record-to-Record Travel 必须写全称；no-op 邻域和 fallback move 必须 trace

  - slug: alns-partial-repair-contract
    description: 定义 ALNS 局部拆修的 allowed-op、payload validation 和执行态保护复用合同
    depends_on: [business-neighborhood-registry]
    status: planned
    feature: null
    minimal_loop: false
    notes: Phase B（ALNS 刚性四连 9-12 起点）；同受证据闸门约束，闸门未放行不启动；局部 repair 结果必须复用正式排产守门链，不能只靠 ALNS 内部校验

  - slug: alns-state-operators-core
    description: 建立 ALNS state、destroy/repair operator 接口、operator reward 和权重更新
    depends_on: [alns-partial-repair-contract]
    status: planned
    feature: null
    minimal_loop: false
    notes: 先做纯 Python 外壳，不引入 alns/job-shop-lib 包、NumPy/Matplotlib 或重依赖

  - slug: alns-sgs-repair-adapter
    description: 把 ALNS repair 接到现有 SGS，确保 repair 后完整校验并返回候选结果
    depends_on: [alns-state-operators-core]
    status: planned
    feature: null
    minimal_loop: false
    notes: repair 失败必须明确 rejected/failed；seed_results 只能放保护/执行态固定片段，mutable operations 必须由 SGS 重新落位

  - slug: alns-selection-acceptance-trace
    description: 实现 ALNS operator 选择、threshold/Record-to-Record Travel/SA acceptance、segment 权重更新和 trace 输出
    depends_on: [alns-sgs-repair-adapter]
    status: planned
    feature: null
    minimal_loop: false
    notes: operator reward 只影响后续选择概率，不能直接覆盖 objective score

  - slug: optimizer-integration-auto-selection
    description: 把 GRASP/IG/VNS/SA/ALNS 候选接回 OptimizationOutcome、候选比较和 summary
    depends_on: [diagnostic-public-id-boundary-fix, vns-sa-local-search-upgrade, alns-selection-acceptance-trace]
    status: planned
    feature: null
    minimal_loop: false
    notes: 职责收敛为"多算法统一自动选择"，不是各算法集成的唯一入口；GRASP/IG 等应在各自 feature 完成时增量接回，不被本项劫持到末尾；public 只展示小摘要；diagnostics 不得直接被页面普通模板渲染

  - slug: benchmark-ratchet-quality-gate
    description: 把 tiny oracle、非劣化阈值、稳定性统计纳入轻/中/长三层门禁
    depends_on: [optimizer-integration-auto-selection]
    status: planned
    feature: null
    minimal_loop: false
    notes: 普通 PR 门禁只放快而稳的检查，长跑统计进 long gate

  - slug: long-run-tuning-evidence
    description: 建立长跑调参、operator 权重、不同 seed 的统计证据和归档口径
    depends_on: [benchmark-ratchet-quality-gate]
    status: planned
    feature: null
    minimal_loop: false
    notes: 证据默认写 ignored 或临时目录，显式写 tracked evidence 时必须重新 clean proof
