  - slug: alns-domain-neighborhood-operators
    description: 定义 ALNS 领域邻域算子：联合机器-排序、关键块 N5 和移动瓶颈候选
    depends_on: [alns-sgs-repair-adapter]
    status: planned
    feature: null
    minimal_loop: false
    notes: |-
      只生成资源 override、batch_order 或 repair request，不直接写工序时间；机器选择必须先确认业务资源资格真实可选，缺资格数据一律 candidate_rejected/fail-loud；关键块 N5 和移动瓶颈只作为 destroy scope、repair priority 或 operator 候选，仍复用正式 SGS 解码和 CandidateFingerprint。

      本项承载领域剪枝规则，不新增独立“剪枝算法”。

      领域剪枝规则组：

      1. critical_block_pruning
      - 输入：正式 decoded schedule、objective metrics、graph critical metrics、延期批次摘要。
      - 只选择影响 failed_ops / tardiness / due pressure / critical path 的关键块。
      - N5 / adjacent move 只在关键块边界、延期边界、瓶颈交界处生成。
      - 非关键块候选记为 pruned_by_scope_filter，safety_status=heuristic_scope_reduction。
      - 不得写成数学 proof，只能写“启发式缩小邻域”。

      2. moving_bottleneck_candidate_pruning
      - 输入：设备负荷、残余容量、延期相关工序、候选资源资格。
      - 只选择 top_m bottleneck machines 和 top_n impacted operations。
      - 非瓶颈设备候选记为 pruned_by_scope_filter。
      - 如果资源资格缺失，必须 candidate_rejected/fail-loud，不能回退成所有设备可用。
      - 移动瓶颈只能影响 destroy scope / repair priority / resource override，不能直接指定时间。

      3. joint_machine_order_pruning
      - 输入：真实可选资源资格、resource_pool、当前 decoded order、目标指标。
      - 候选只表达 resource override + batch_order / repair request。
      - 未授权资源、不可用资源、缺资格资源必须 rejected，不得作为可行候选。
      - dominance 只允许在同 objective、同可行性、同资源资格语义下使用。
      - 不满足严格 dominance 证据时，只能标 heuristic_scope_reduction。

      4. tardy_boundary_pruning
      - 输入：延期批次、可救批次、长尾牺牲批次、due pressure / saveability。
      - 只围绕可救/延期边界生成候选。
      - 空交期批次不能伪装成延期压力；必须沿用 no-due placeholder / not comparable 语义。
      - 对不可救长尾的后置只能作为候选 priority，不能写成 proof。

      5. duplicate_and_budget_guard
      - decision_key 重复：duplicate_decision_pruned。
      - output fingerprint 重复：same_fingerprint_rejected。
      - 超 top_k / top_m / top_n / time_budget：skipped_by_budget。
      - 三者必须分开计数。

      每条规则必须输出：
      - rule_id
      - rule_version
      - operator_name
      - candidate_space_before
      - candidate_space_after
      - generated_candidates
      - pruned_candidates
      - reason_summary
      - safety_status
      - objective_compatibility

      测试验收：
      - 关键块规则不会生成全场所有 swap/insert。
      - 移动瓶颈规则只选 top_m 设备，且缺资源资格 fail-loud/rejected。
      - 联合机器-排序不会使用未授权资源。
      - duplicate decision 不进入正式 SGS 解码。
      - same fingerprint 不算 improvement。
      - scope filter 的剪枝状态必须是 heuristic_scope_reduction，不能是 safe_exact proof。

  - slug: alns-setup-aware-neighborhoods
    description: 在换型基准量尺到位后定义 setup-aware 拆修邻域
