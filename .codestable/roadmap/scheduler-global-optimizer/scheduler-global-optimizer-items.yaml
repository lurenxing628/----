  - slug: graph-ready-v2-elite-local-repair
    description: 对 GraphReady v2 前 K 个候选做轻量局部修补，修复接近好解但差一两步的排序
    depends_on: [graph-ready-v2-candidate-portfolio]
    status: in_progress
    feature: null
    minimal_loop: false
    notes: |-
      生产落地方向不是新增独立“剪枝算法”，而是在 GraphReady v2 elite repair 中先落最小生产级剪枝策略包。

      目标：
      - 只对 GraphReady v2 已正式 SGS 解码并进入候选池的前 K 个精英候选做轻量 repair。
      - repair 只能生成 batch_order / graph priority / repair request 这类候选决策，不能直接写 ScheduleResult、start_time、end_time 或正式计划表。
      - 每个 repair 邻居必须重新走正式 SGS 解码、compute_metrics、objective_score、CandidateFingerprint、candidate_is_preferred 和 SearchReport。
      - 只有正式 objective score 严格更好、output_fingerprint 非 parent/seen、acceptance 通过时，才能采纳为 graph_ready_v2_repaired。

      配置合同：
      - graph_ready_optimization.elite_repair.enabled: bool
      - graph_ready_optimization.elite_repair.top_k: 正整数，默认 3，系统上限建议 8
      - graph_ready_optimization.elite_repair.max_neighbors_per_elite: 正整数，默认 8，系统上限建议 32
      - graph_ready_optimization.elite_repair.time_budget_ms: 正整数，默认从 optimizer 剩余预算派生，必须独立报告
      - graph_ready_optimization.elite_repair.neighbor_generators: adjacent_swap / single_insert / tardy_boundary_move
      - graph_ready_optimization.elite_repair.pruning_strategy: elite_top_k + duplicate_decision + budget_guard

      候选空间口径：
      - candidate_space_total = top_k 精英候选在启用 neighbor_generators 后理论邻居数；无法精确时写 upper_bound 或 unknown。
      - generated_candidates = 实际生成的 repair 邻居数。
      - evaluated_candidates = 实际重新走正式 SGS 解码的 repair 邻居数。
      - pruned_candidates = 已生成但因 duplicate_decision、same elite no-op、scope filter 等原因未解码的邻居数。
      - skipped_by_budget = 因 top_k、max_neighbors_per_elite、time_budget_ms 或全局 deadline 未生成/未评估的邻居数；不能写成证明型剪枝。

      必填报告字段：
      - repair_enabled
      - repair_top_k
      - repair_max_neighbors_per_elite
      - repair_time_budget_ms
      - repair_candidate_space_total
      - repair_candidate_space_total_status
      - repair_generated_candidates
      - repair_evaluated_candidates
      - repair_pruned_candidates
      - repair_skipped_by_budget
      - repair_rejection_summary
      - repair_pruning_report
      - repair_best_origin
      - repair_accepted
      - repair_status: not_run / skipped_no_elite / skipped_by_budget / no_strict_improvement / strict_improvement / all_candidates_rejected

      邻居规则：
      - adjacent_swap: 只交换 elite decoded order 中相邻批次/相邻 ready 决策，重复 decision_key 必须跳过。
      - single_insert: 只移动 top tardy / due pressure / critical ready 相关批次，不能全量枚举所有插入位置。
      - tardy_boundary_move: 只围绕延期边界、可救批次、长尾牺牲批次生成少量候选。
      - 所有邻居都必须可复现，seed 来自 optimizer version 派生。

      接受规则：
      - repair 后 score 必须严格小于当前 best score。
      - output_fingerprint 必须不同于 parent 和 seen。
      - same_fingerprint 只能进入 rejected/same_fingerprint，不得算 improvement。
      - repair 失败必须 candidate_rejected 或 fail-loud，不能返回原方案假装成功。
      - 如果只是预算没跑，必须写 skipped_by_budget，不能写 pruned_by_bound。

      public/diagnostics 边界：
      - public 只展示 repair 是否启用、top_k、评估数、剪枝数、预算跳过数、是否采纳、中文拒绝摘要。
      - diagnostics 可保留 rule_trace，但不得把 raw op_id/resource_id/fingerprint hash 暴露到 public、HTML、导出或 OperationLogs public 投影。

      测试验收：
      - 新增或扩展 test_optimizer_graph_ready_v2_elite_repair_contract.py。
      - 覆盖 top_k 截断、max_neighbors_per_elite 截断、time_budget_ms 截断。
      - 覆盖 duplicate decision 被 pruned/rejected，不能进入 evaluated_candidates。
      - 覆盖 same output fingerprint 被 rejected，不能算 improvement。
      - 覆盖 repair 候选必须调用正式 schedule_fn / SGS 解码，不能直接构造 ScheduleResult。
      - 覆盖 score 不严格变好不采纳。
      - 覆盖 public summary 不泄漏内部 id 或 fingerprint hash。
      - 覆盖 benchmark_support_only_not_core 口径删除或替换为生产 core 口径后，才能置为 done。

      当前状态：
      - benchmark 支撑里已有 adjacent swap 与 single insert 的确定性 repair 脚手架，并能区分 graph_ready_v2_no_repair / graph_ready_v2_with_repair。
      - 生产 core 仍未落地 top-K elite、max_neighbors_per_elite、time_budget_ms、tardy_boundary_move、repair pruning report 和正式 SGS 接受链。
      - 本项完成前不得把 benchmark repair 结果包装成生产能力。

