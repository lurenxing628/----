  - slug: graph-ready-v2-comparative-ratchet-gate
    description: 建立 GraphReady v2 修改后的轻/中/长对比门禁，和当前基准及其他算法做胜平负统计
    depends_on: [graph-ready-v2-portfolio-integration]
    status: in_progress
    feature: null
    minimal_loop: false
    notes: |-
      本项只负责比较门禁和反假证明，不实现剪枝算法本体。

      已有门禁继续保留：
      - benchmark_optimizer_ratchet.py --check-baseline
      - benchmark_optimizer_compare_algorithms.py --check-baseline
      - benchmark_optimizer_long_run.py --seeds 10 --no-write
      - benchmark_optimizer_medium_gate.py --run
      - portfolio_all 只能报告 posthoc_upper_bound / not_comparable，不能作为同预算普通胜负。
      - dirty_worktree / unbound_dirty_worktree 证据不能冒充 clean proof。
      - 缺算法、缺指标、目标不可比时必须失败或标 not_comparable。

      剪枝补充门禁：
      - pruning_enabled=true 时，必须存在 pruning_report 或阶段级 pruning summary。
      - evaluated_candidates 必须等于真实正式 SGS/Greedy 解码次数，不能把 pruned/skipped 候选算进去。
      - pruned_candidates 必须有 pruned_by_rule / reason summary。
      - skipped_by_budget 必须单独报告，不能计入 pruned_by_bound。
      - 如果出现 pruned_by_bound > 0，必须同时报告 objective_name、bound_metric、objective_compatibility=same_objective；否则门禁失败或强制 not_comparable。
      - 如果 bound_metric=makespan 且 objective_name 属于 min_overdue/min_tardiness/min_changeover，必须标 not_comparable，不能进入 gap/improved 证明。
      - same_fingerprint_rejected 只能来自正式 decoded output fingerprint，不能在未解码候选上伪造。
      - duplicate_decision_pruned 和 same_fingerprint_rejected 必须分开计数。
      - repair/pruning 采纳成功必须同时满足 strict score improvement、fingerprint changed、acceptance passed。
      - no-write / ignored evidence 可以做调研，不能写成 tracked clean proof。
      - dirty proof、预算未评估、不可比下界三者任一出现时，public 必须明确说明证明状态受限。

      新增测试建议：
      - benchmark gate fixture: pruned_by_bound 使用 makespan 去证明 min_overdue 时必须失败或 not_comparable。
      - benchmark gate fixture: skipped_by_budget 被写成 proof pruning 时必须失败。
      - benchmark gate fixture: dirty_worktree=true 且报告 clean_proof=true 时必须失败。
      - benchmark gate fixture: same_fingerprint_rejected 计入 improvement 时必须失败。

      当前状态：
      - 本轮已跑 benchmark_optimizer_ratchet.py --check-baseline、benchmark_optimizer_compare_algorithms.py --check-baseline --allow-dirty-proof --no-write、benchmark_optimizer_long_run.py --seeds 10 --no-write、benchmark_optimizer_medium_gate.py --run。
      - v2_no_repair 在 GraphReady 10 seed 基准中对 greedy/local_search 为 10/0/0，对 grasp_ig 为 5/5/0，对 graph_ready_v1 为 10/0/0，均值 primary_delta 分别为 -2.0/-2.0/-0.6/-1.0。
      - portfolio_all 是事后上界，只能报告差距、来源和 not_comparable，旧 0/10/0 不能作为同预算普通胜负。
      - 本轮证据为 dirty_worktree/unbound_dirty_worktree，且长跑脚本仍是旧 graph_ready 长跑，未建立最新 HEAD clean comparative ratchet baseline，因此保持 in_progress。

