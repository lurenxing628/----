  - slug: optimizer-candidate-profile-contract
    description: 定义非 OR-Tools 搜索 profile，收紧配置校验和非法参数 fail-loud 合同
    depends_on: [optimizer-search-report-contract]
    status: done
    feature: 2026-06-28-optimizer-candidate-profile-contract
    minimal_loop: false
    notes: 已落地 CandidateProfile 合同(core/services/scheduler/run/optimizer_candidate_profile.py)并接入 OptimizationSearchReport.candidate_profile；configured/effective time budget 与 max_iterations 区分、迭代 [200,5000] 系统钳制如实写 system_limit_applied/system_limit_reason/iteration_limit_source；derive_iteration_limits 作为迭代上限单一真相源,local search 改为共用(零行为变化);未知 profile/repair/acceptance/neighborhood 与非法 budget 一律 fail-loud(与 strict 无关);profile_public/profile_diagnostics 白名单分层 + size guard 最小摘要保留 profile_public;seed 如实标 version 派生。item 4 初始落地时只覆盖 baseline/multi_start_local_search、repair=sgs、acceptance=improve_only 与旧 swap/insert/block 邻域；当前生产能力已由 item 6/7/8 扩展为 grasp_ig/vns_sa、六个业务邻域 + SGS 专用 sgs_dispatch_rule，以及 improve_only/threshold/record_to_record/simulated_annealing acceptance，未知值仍 ValidationError。未做 item 5 完整 CandidateFingerprint。

  - slug: distinct-candidate-fingerprint-contract
    description: 定义候选指纹、去重计数、same-fingerprint 拒绝和 improved 判定合同
    depends_on: [optimizer-candidate-profile-contract]
    status: done
    feature: 2026-06-28-distinct-candidate-fingerprint-contract
    minimal_loop: false
    notes: 已落地 CandidateFingerprint 合同(core/services/scheduler/run/optimizer_candidate_fingerprint.py);decision_fingerprint 覆盖 objective/strategy/params/dispatch/batch_order/resource/seed/mutable_scope,output_fingerprint 覆盖正式解码结果数量、工序-资源-时间签名、summary 与当前 objective score;distinct_candidates/accepted_distinct_candidates 改为按 decoded_output 去重并在 public/minimal 摘要声明口径;improved 显式要求 fingerprint_changed + score_strictly_better + acceptance_passed(acceptance=improve_only);same_as_parent/same_as_seen 记 same_fingerprint 拒绝,不算 improvement;hash 和内部输入只进 diagnostics,public/OperationLogs/size guard 不透传内部 id 或 fingerprint hash。

  - slug: grasp-ig-candidate-construction
    description: 用 GRASP 和 Iterated Greedy 生成更多可行起点，仍由现有 SGS 落位
    depends_on: [distinct-candidate-fingerprint-contract]
    status: done
    feature: 2026-06-28-grasp-ig-candidate-construction
    minimal_loop: false
    notes: 已落地 GRASP/IG 候选构造；默认 improve profile 扩展为 grasp_ig，candidate_strategy_families=multi_start/grasp/iterated_greedy；GRASP/IG 只生成批次顺序候选并通过 batch_order 派工解码，不保留不可达的 sgs 候选分支；候选接入 CandidateProfile/SearchReport/CandidateFingerprint，distinct 继续按 decoded_output 去重，same-fingerprint 不算 improved；没有真实 best acceptance event 时 acceptance_passed=false 且 improved=false；public/OperationLogs/size guard 只投安全摘要。

  - slug: business-neighborhood-registry
    description: 建立关键链、延期批次、瓶颈设备、换型块、资源替换、时间窗 repair 的邻域注册表
    depends_on: [distinct-candidate-fingerprint-contract]
    status: done
    feature: 2026-06-28-business-neighborhood-registry
    minimal_loop: false
    notes: 已落地业务邻域 registry 与 NeighborhoodMove 合同；支持 critical_chain/tardy_window/bottleneck_machine/changeover_block/resource_alternative/time_window 六个业务邻域，另有 SGS 专用 sgs_dispatch_rule 用于 dispatch_mode=sgs 时切换派工规则；旧 swap/insert/block 不在正式 registry 和 profile 白名单里；默认 improve profile 的 configured_neighborhoods 为六个业务邻域，实际执行 effective_neighborhoods 需按当前派工模式报告，SGS 时只能是 sgs_dispatch_rule，未知邻域 ValidationError fail-loud；local search 通过 registry 生成 move 后仍调用现有正式解码链，SearchReport 记录 neighborhood_moves diagnostics 与 neighborhood_summary public 小摘要；no-op 记 noop_neighbor，fallback 必写 fallback_reason；public/OperationLogs/size guard 不透传 raw move、内部 op/resource id、fingerprint hash。未做 VNS/SA acceptance，未做 ALNS。

  - slug: vns-sa-local-search-upgrade
    description: 把现有 local search 升级为 VNS 和 SA 后处理，先做轻量可复现版本
    depends_on: [grasp-ig-candidate-construction, business-neighborhood-registry]
    status: done
    feature: 2026-06-28-vns-sa-local-search-upgrade
    minimal_loop: false
    notes: 已落地 VNS/acceptance 局搜升级；新增 current/best 分离状态，非改进候选可按 threshold/record_to_record/simulated_annealing 接受为 current，但 best 只在 acceptance 通过、score 严格更优、output_fingerprint 非 parent 且非 seen 时更新；CandidateProfile 默认 improve 扩展为 vns_sa，acceptance 白名单扩为 improve_only/threshold/record_to_record/simulated_annealing，未知 acceptance 继续 ValidationError fail-loud；SearchReport 新增 acceptance_events/acceptance_summary、vns_events/vns_summary，并把 acceptance_passed 改为真实 best acceptance 事件，不再用 accepted_candidates>1 代理；public/OperationLogs/size guard 只投 acceptance/VNS 安全计数摘要，不泄漏 raw random draw、fingerprint hash、raw move 或内部 op/resource id。未做 ALNS。

