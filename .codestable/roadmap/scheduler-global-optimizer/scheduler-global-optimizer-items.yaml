  - slug: alns-state-operators-core
    description: 建立自适应大邻域拆修搜索 state、destroy/repair operator 接口、operator reward 和权重更新
    depends_on: [alns-partial-repair-contract]
    status: planned
    feature: null
    minimal_loop: false
    notes: |-
      先做纯 Python 外壳，不引入 alns/job-shop-lib 包、NumPy/Matplotlib 或重依赖；ALNSOperatorResult 字段必须在本项启动时定稿，非法 score/repair 输出/seed_results 必须 fail-loud。

      剪枝合同必须在本项一并定稿，但不新增独立“剪枝算法”路线。

      新增核心结构：
      - ALNSState
      - ALNSOperator
      - ALNSOperatorResult
      - ALNSCandidateDecision
      - ALNSPruningReport
      - PruningRuleDecision
      - PruningRuleTrace

      ALNSOperatorResult 必填字段：
      - schema_version
      - operator_name
      - operator_version
      - destroy_scope
      - repair_request
      - candidate_decisions
      - generated_candidates
      - evaluated_candidates
      - pruned_candidates
      - rejected_candidates
      - skipped_by_budget
      - pruning_report
      - reward_delta
      - reward_reason
      - objective_score_before
      - objective_score_after
      - accepted
      - accepted_as: none / current / best
      - safety_status

      PruningRuleDecision 字段：
      - rule_id
      - rule_version
      - phase
      - operator_name
      - decision: keep / prune / reject / skip_by_budget
      - reason
      - safety_status: safe_exact / safe_duplicate / safe_feasibility / heuristic_scope_reduction / budget_only / not_comparable / unsafe_disallowed
      - objective_name
      - objective_compatibility
      - candidate_space_before
      - candidate_space_after
      - generated_delta
      - pruned_delta
      - skipped_delta
      - diagnostics

      计数规则：
      - generated_candidates 是 operator 明确生成出来的候选数。
      - evaluated_candidates 是正式 SGS/Greedy 解码次数。
      - pruned_candidates 是生成后、正式解码前因规则剪掉的候选数。
      - rejected_candidates 是生成或评估后被合同拒绝的候选数。
      - skipped_by_budget 是因预算未生成或未评估的候选数，不能算 proof。
      - duplicate decision 可 pre-evaluation prune；same output fingerprint 只能 post-evaluation reject，除非有严格 memoized equivalence 证明。

      bound / dominance 规则：
      - pruned_by_bound 只能用于 same_objective / same_metric / same_model。
      - dominance 必须声明支配关系字段和目标兼容性；缺任何字段时 safety_status=heuristic_scope_reduction 或 not_comparable。
      - 不允许用 makespan 下界剪掉 min_overdue/min_tardiness/min_changeover 候选。
      - 不允许用预算、经验、历史命中率伪装成 bound proof。

      operator reward 规则：
      - reward 只能影响后续 operator selection probability。
      - reward 不能直接覆盖 objective_score。
      - reward 不能把组合池 posthoc best 归功给单个 operator。
      - accepted_as=best 必须来自正式 score 严格更好 + fingerprint changed + acceptance passed。

      测试验收：
      - ALNSOperatorResult 缺 pruning_report 时 fail-loud 或合同测试失败。
      - pruned_by_bound 与 objective 不兼容时 not_comparable/failed。
      - skipped_by_budget 计入 proof 时失败。
      - operator reward 修改 objective_score 时失败。
      - duplicate_decision_pruned 与 same_fingerprint_rejected 混算时失败。

  - slug: alns-sgs-repair-adapter
