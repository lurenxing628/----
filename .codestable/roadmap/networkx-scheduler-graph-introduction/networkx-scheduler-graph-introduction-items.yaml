    notes: "已完成：2026-05-18 阶段 11 实现有环安全门，report 有环只提示，on+block=yes 在 version 分配前抛中文 ValidationError 并带 reason/cycle_edges_sample 等结构化详情，on+block=no 继续旧 SGS 候选逻辑但 public 明确 ready_queue_enabled=false、graph_enhancement_disabled_reason=schedule_graph_cycle；该路径通过 graph_dispatch_mode_override=\"sgs\" 强制 optimizer 走 SGS，同时 graph_ready_context 保持 None，避免误启用 ready 队列。known graph error 不伪装成有环，unknown graph error 不静默吞掉。阶段 12a 实现 ready_queue.py 纯 Python helper，只处理 op_id 集合、前置映射、blocked/completed/fixed 集合和排序 key，不接 NetworkX、不读数据库/配置、不调评分或资源匹配；实际 helper 下沉到 core/algorithms/greedy/dispatch/ready_queue.py，core/services/scheduler/graph/ready_queue.py 保留兼容导出，避免算法层反向 import service；已补强 op_id 集合、前后置嵌套集合的图对象误传合同，以及 sort_key 值、字符串 key、bool key 合同。阶段 12b/12c 在 optimizer 前准备 graph_ready_context，并让排产和 result_summary 共用同一份图分析结论，沿 schedule_orchestrator、schedule_optimizer、schedule_optimizer_steps、optimizer_local_search、GreedyScheduler.schedule、dispatch_sgs 传递普通 Python 结构。阶段 12d 在 on+DAG 且 graph_enhancement_allowed=true 时启用 ready 队列筛 SGS 候选；有 graph_ready_context 时 optimizer 强制 SGS，避免 public 摘要和实际 dispatch mode 漂移；graph_ready_context 直接配非 SGS 会报错，避免绕过 optimizer 时 ready 队列被 batch_order 悄悄忽略；无 graph_ready_context 时旧 _collect_sgs_candidates 行为保持；graph_dispatch_mode_override 只允许内部使用 sgs，其他值直接报错；评分、资源匹配、build_dispatch_key、SLACK/CR/ATC 方向未改；SGS 会把前后置映射标准化后写回运行态，确保校验和阻断使用同一口径。frozen/seed 只作为已固定前置，不重复进 candidates，不重复写 rows；前置失败时图后继不释放，并补失败计数和中文错误说明。只同步已有配置说明文字和镜像模板，不新增页面按钮或路由。PR-5 只证明 ready 资格可以交给 SGS 候选，PR-6 不能继承任何图评分方向证明，仍需单独证明关键路径/影响范围评分不破坏原有评分语义。"

