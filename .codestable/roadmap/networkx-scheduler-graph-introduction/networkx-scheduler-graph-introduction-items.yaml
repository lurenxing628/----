  - slug: scheduler-graph-auto-selection-comparison
    title: PR-7 多权重自动择优和代表方案对比
    description: "排产时先跑原算法候选，再按系统预设默认 5 档关键链权重试跑；复用当前评分目标自动择优，并在评分接近时用关键链健康做平衡判断。所有候选保存摘要，完整明细只保存最终采用方案、原算法最好方案、关键链最好方案，并让主要结果页支持代表方案切换。"
    status: planned
    feature: null
