      - web/viewmodels/
      - templates/scheduler/
      - templates/system/history.html
      - tests/regression_scheduler_graph_auto_selection_contract.py
      - tests/regression_scheduler_candidate_plan_switch_contract.py
    exit_checks:
      - PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q tests/regression_scheduler_graph_auto_selection_contract.py tests/regression_scheduler_candidate_plan_switch_contract.py
      - PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q tests/regression_scheduler_graph_on_mode_contract.py tests/regression_scheduler_graph_summary_contract.py
    notes: "第一版默认关键链参与排产；候选 0 必须是原算法兜底，关键链候选默认 5 档且档数可在高级设置改。择优先复用当前 objective_score，failed_ops 不能变差；超期批次数默认最多多 1 个、拖期时长默认 10% 容差，后续允许在高级设置调。第一版串行试跑，不做实时评分、不做多进程、不做续跑、不把每个候选保存成正式历史版本。"

