      - PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q tests/regression_optimizer_public_summary_projection_contract.py tests/regression_schedule_summary_v11_contract.py
    notes: "已完成：阶段 10 在 schedule_orchestrator 的排产结果和 validated_schedule_payload 都已生成之后，旁路调用 graph input_adapter、ScheduleGraphAnalysisService 和 exporter；图报告判断、错误投影和采样投影收在 schedule_graph_report.py，避免 orchestrator 超过架构门禁文件大小阈值。graph_analysis_mode=off 不 import graph 模块、不写 graph_analysis；report 写 result_summary.algo.graph_analysis 小摘要和 result_summary.diagnostics.graph_analysis 采样诊断；on 在本阶段只输出 effective_mode=report_only，不接 ready 队列、不接评分。OperationLogs 继续沿用现有 algo 小摘要路径，只能看到 graph_analysis public 小摘要，不能看到 diagnostics、nodes、edges、raw、完整 node_metrics 或完整 topological_order。阶段 0 三个 baseline case 在 report 模式下对比通过，排产 rows、best_order、selected_batch_ids、freeze_window 和 resource_pool 公开状态未变；本阶段未改 schedule_optimizer.py、GreedyScheduler、SGS、seed_results、冻结窗口、validated_schedule_payload 或 schedule_rows。"

