      - 是否建议重排 suggest_reschedule 固定为 true/false；页面只显示建议重新排程、暂不建议重新排程，不自动触发重排
      - handling_status 第一版只记录上报当时处理状态，不做后续更新动作；如果 feature-design 要支持更新处理状态，必须同时补更新路由、权限、状态流转和测试
