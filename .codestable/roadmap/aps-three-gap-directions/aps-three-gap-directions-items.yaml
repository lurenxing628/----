      - 必须有页面按钮放开测试和绕过页面直接 POST 放开测试；只测算法最小护栏不算完成
      - 实施本条 feature 时必须新增或更新并通过这些测试：PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q tests/schedule/service/test_scheduler_reschedule_execution_minimum_guard.py tests/operation_execution/test_operation_execution_feedback_routes.py tests/app_runtime/test_frontend_offline_static_assets.py tests/schedule/route_view/test_scheduler_run_surfaces_resource_pool_warning.py
