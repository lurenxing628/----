    forbidden_paths:
      - core/algorithms/
      - installer/
      - vendor/
    exit_checks:
      - processing 状态允许 pause、finish、exception
      - paused 状态允许 resume、finish、exception
      - exception 状态允许 resume、finish
      - not_started 状态不允许直接 exception；未开工发现问题时先由计划员处理计划或资源数据
