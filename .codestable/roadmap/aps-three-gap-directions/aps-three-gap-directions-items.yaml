      - 页面、按钮、空状态、错误提示、导出内容都使用中文大白话，不显示内部英文枚举、数据库字段名、函数名
      - 新前端资源不走 CDN、外链字体、外链脚本、外链样式，不引入新前端框架或 Chrome 109 不支持能力
      - 新增 Python 代码保持 Python 3.8 语法，不升级破坏 Win7 x64 的依赖
      - 实施本条 feature 时必须新增或更新并通过这些测试：PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q tests/candidate/test_scheduler_candidate_analysis_contract.py tests/candidate/test_scheduler_candidate_plain_language.py tests/app_runtime/test_frontend_offline_static_assets.py tests/candidate/test_scheduler_candidate_summary_contract.py tests/regression_scheduler_graph_auto_selection_contract.py
