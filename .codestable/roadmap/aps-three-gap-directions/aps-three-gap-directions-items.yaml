  - slug: operation-execution-event-foundation
    title: 车间执行事件基础
    description: 新增 OperationExecutionEvents、执行事件 repository、执行状态聚合、幂等键、状态版本、合法状态流转和 schema 迁移测试。
    depends_on: [dispatch-plan-identity-guardrails]
    depends_on_reasons:
      dispatch-plan-identity-guardrails: 执行事件会写现场事实，必须先完成派工身份护栏，保证只有最新正式采用方案能进入后续写入链路。
    status: done
    feature: 2026-05-27-operation-execution-event-foundation
    minimal_loop: false
    primary_paths:
      - schema.sql
      - core/infrastructure/migration_state.py
      - core/infrastructure/migrations/__init__.py
      - core/infrastructure/migrations/v15.py
      - core/infrastructure/migrations/v16.py
      - data/repositories/operation_execution_event_repo.py
      - data/repositories/__init__.py
      - core/models/operation_execution_event.py
      - core/models/operation_execution_labels.py
      - core/models/operation_execution_state.py
      - core/services/scheduler/__init__.py
      - core/services/scheduler/operation_execution_feedback_service.py
      - core/services/scheduler/operation_execution_labels.py
      - web/bootstrap/request_services.py
      - tests/operation_execution/test_operation_execution_event_foundation.py
      - tests/operation_execution/test_operation_execution_state_revision.py
      - tests/migration_db/test_migrations.py
    entrypoints:
      - "从 schema.sql、core/infrastructure/migrations/__init__.py、core/infrastructure/migrations/v{next}.py 和 migration_state.py 新增执行事件表；v{next}.py 里的 next 要先查当前 CURRENT_SCHEMA_VERSION 再递增"
      - "新增 data/repositories/operation_execution_event_repo.py 和 OperationExecutionEventRepo，repository 负责 SQL，service 负责校验身份、幂等、状态版本和状态聚合"
      - "新增 core/models/operation_execution_event.py 和 core/models/operation_execution_state.py，分别放事件行结构和聚合后的现场状态结构"
      - "先做表结构、迁移、repository 和状态聚合，不做暂停/异常业务页面"
    test_commands:
      - "PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q tests/operation_execution/test_operation_execution_event_foundation.py tests/operation_execution/test_operation_execution_state_revision.py tests/migration_db/test_migrations.py"
    forbidden_paths:
      - core/algorithms/
      - installer/
      - vendor/
    exit_checks:
      - schema.sql 和新增迁移脚本都包含 OperationExecutionEvents
      - CURRENT_SCHEMA_VERSION 按当前版本递增，并在 migrations 注册
      - detect_schema_is_current 同步增加 OperationExecutionEvents 的表、字段、FK、CHECK、UNIQUE、索引列和索引唯一性检测；缺表、缺约束、索引列不对或唯一性不对时必须判定为非当前结构
      - 新增 data/repositories/operation_execution_event_repo.py，类名为 OperationExecutionEventRepo
      - OperationExecutionEventRepo 至少包含 get_event_by_id(event_id)、get_by_idempotency_key(idempotency_key)、insert_event(event_row)、list_events_by_op_id(op_id)、list_events_by_op_ids(op_ids)、list_latest_events_by_op_ids(op_ids)、list_latest_exception_events_by_op_ids(op_ids)、aggregate_states_by_op_ids(op_ids)
      - repository 负责 OperationExecutionEvents 的所有 SQL，service 不裸写散 SQL；如果聚合逻辑放在 service，也必须由 repository 提供按 op_ids 批量拉事件的方法
      - event_type 数据库 CHECK 只允许 start、pause、resume、finish、exception；foundation 只验结构和状态聚合边界，pause/resume/exception 的业务含义留给 shop-exception-feedback
      - 程序动作 report_exception 入库前必须转成 event_type=exception；读取返回给前端时必须转回 action=report_exception、action_label=报异常；页面、导出和手册只能显示“报异常”
      - 状态中文名和动作中文名必须分开实现：current_status/reported_status 的 exception 显示“异常中”，event_type=exception 必须先转 action=report_exception 再显示“报异常”，不能共用一个 exception 映射函数
      - reported_status 数据库 CHECK 只允许 processing、paused、exception、completed，后续条目不能再使用 running 或 finished
      - 每条事件强制绑定正式 Schedule 行，包含 schedule_version、schedule_id、source_table、effective_plan_role、scenario_id；schedule_id、schedule_version、op_id、batch_id 必须在同一事务里重新查库确认属于同一条正式计划行
      - 数据库外键包含 op_id -> BatchOperations(id)、schedule_id -> Schedule(id)，并有 source_table='schedule'、effective_plan_role='adopted'、scenario_id IS NULL 约束
      - 索引包含 op_id+event_time、schedule_id、schedule_id+op_id、batch_id、op_id+previous_state_revision
      - OperationExecutionEvents 表只保存 previous_state_revision，不保存本条事件写入后的新 state_revision；新 state_revision 由插入后聚合状态返回，不能 UPDATE 事件行
      - idempotency_key 唯一；request_fingerprint 由服务端根据完整计划身份、expected_state_revision、动作和动作载荷重算，不能信任前端
      - 幂等判断必须排在状态版本判断前面：先查 idempotency_key，同 key 同服务端 fingerprint 和同载荷直接返回已有事件；只有 key 不存在时才比较 expected_state_revision，不能把重复提交误判成 stale_state_revision
      - 同 key 同服务端 fingerprint 且同计划身份、同 op_id、同动作、同载荷时返回已有事件；同 key 但任一项不一致返回 409 且 details.reason=idempotency_conflict，不写事件
      - 捕获任何 UNIQUE 冲突后都必须先重新按 idempotency_key 查同 key；同 key 同 fingerprint 且同计划身份、同 op_id、同动作、同载荷返回已有事件，同 key 不同内容返回 409 idempotency_conflict
      - 捕获 idempotency_key UNIQUE 冲突后必须通过 OperationExecutionEventRepo.get_by_idempotency_key(idempotency_key) 回查，不能在 service 里临时写 SQL
      - expected_state_revision 不一致返回 409 且 details.reason=stale_state_revision，不写新事件；数据库用 UNIQUE(op_id, previous_state_revision) 或 BEGIN IMMEDIATE 等价行锁防并发双写
      - 只有 UNIQUE 冲突后查不到同 idempotency_key，且冲突来自 op_id+previous_state_revision 这类状态版本约束时，才重新聚合状态并返回 409 stale_state_revision
      - state_revision 用写入前已提交事件聚合出的 op_id:event_count:last_committed_event_id 口径生成；不能依赖本次刚插入后才知道的事件 id 来决定是否允许写入
      - schedule_id 和 schedule_version 只记录事件发生时用户看到的正式计划行；执行状态读取必须按 op_id 跨版本聚合，不能复制旧事件到新 schedule_id
      - created_by 第一版来自页面必填反馈人，不能为空，不能默认写 system 或假用户
      - 事件聚合能推导 OperationExecutionState 全字段：op_id、batch_id、current_status、current_status_label、actual_start_time、actual_end_time、actual_duration_minutes、pause_duration_minutes、actual_machine_id、actual_machine_label、actual_operator_id、actual_operator_label、last_event_id、last_event_type、last_event_time、last_event_action_label、last_event_remark、latest_exception_event_id、latest_exception_time、latest_exception_reason_code、latest_exception_reason_label、latest_exception_severity、latest_exception_severity_label、latest_exception_impact_minutes、latest_exception_impact_minutes_label、latest_exception_affected_machine_id、latest_exception_affected_machine_label、latest_exception_affected_operator_id、latest_exception_affected_operator_label、latest_exception_handling_status、latest_exception_handling_status_label、latest_exception_suggest_reschedule、latest_exception_suggest_reschedule_label、latest_exception_remark、state_revision、updated_at
      - 事件聚合必须分开 last_event_* 和 latest_exception_*：last_event_* 表示最后一条现场事件，latest_exception_* 表示最近一次报异常；完工后仍保留最近异常信息，没有异常时 latest_exception_* 为空或默认 false
      - 不能把暂停原因、完工备注或最后事件备注塞进 latest_exception_*；也不能因为最后一条事件不是异常就清掉历史最近异常
      - 执行事件只追加，不允许更新或删除；纠错和撤销另起后续设计
      - 不修改历史 Schedule.start_time/end_time
      - 不把 BatchOperations.status 当作现场事实的唯一来源
      - 新库 schema 测试和老库迁移测试通过
      - 新增 Python 代码保持 Python 3.8 语法，不升级破坏 Win7 x64 的依赖
      - 实施本条 feature 时必须新增或更新并通过这些测试：PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q tests/operation_execution/test_operation_execution_event_foundation.py tests/operation_execution/test_operation_execution_state_revision.py tests/migration_db/test_migrations.py
    notes: 调研时当前 schema 是 v14；实现时先确认最新版本，再递增。

