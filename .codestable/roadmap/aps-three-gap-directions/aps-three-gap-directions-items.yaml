items:
  - slug: shared-plan-identity-evidence-contract
    title: 公共读取身份与证据协议
    description: 统一读取排程结果时必须带的计划身份、证据来源和中文显示口径；只做公共读取协议，不提前实现派工确认或现场反馈写入。
    depends_on: []
    depends_on_reasons: {}
    status: done
    feature: 2026-05-27-shared-plan-identity-evidence-contract
    minimal_loop: false
    primary_paths:
      - core/models/schedule_plan_role.py
      - core/services/scheduler/schedule_plan_query_service.py
      - data/repositories/schedule_plan_query_repo.py
      - data/repositories/schedule_history_repo.py
      - web/viewmodels/scheduler_analysis_candidates.py
      - tests/schedule/route_view/test_scheduler_plan_identity_evidence_contract.py
      - tests/gantt/test_scheduler_candidate_gantt_plan_role_contract.py
    entrypoints:
      - "从本 roadmap 的 5.1 PlanIdentity 和 5.2 EvidenceLink 开始写 feature-design"
      - "重点阅读 core/services/scheduler/schedule_plan_query_service.py 和 data/repositories/schedule_plan_query_repo.py"
      - "检查所有会读取排程结果的页面是否都复用同一套计划身份和中文显示名"
    test_commands:
      - "PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q tests/schedule/route_view/test_scheduler_plan_identity_evidence_contract.py tests/gantt/test_scheduler_candidate_gantt_plan_role_contract.py"
    forbidden_paths:
      - installer/
      - vendor/
    exit_checks:
      - 明确 adopted、baseline_best、critical_best、scenario_id、source_table 的代码含义和用户能看到的中文说法
      - PlanIdentity 字段包含 version、requested_plan_role、effective_plan_role、plan_resolution_status、source_table、source_row_id、candidate_id、candidate_key、scenario_id、schedule_result_status、is_simulation、label、user_label、is_official、is_preview、is_current_executable_version、is_current_executable_official_version、is_superseded_by_newer_version、schedule_lock_status、can_dispatch、can_write_feedback、detail_saved
      - 当前可执行版本按最新正式 ScheduleHistory.version 判定；Schedule.lock_status 只作冻结展示，不和“被新版本替代”混用
      - can_dispatch 和 can_write_feedback 只有当前可执行正式采用方案才可能为 true；候选方案、模拟预览、历史正式方案、被新版本替代版本、模拟结果、失败结果、缺明细回退结果都必须为 false
      - baseline_best 和 critical_best 是对比角色，来源以 source_table 为准；即使 source_table=schedule，也只能按对比参考展示，不能写现场反馈
      - EvidenceLink 支持 row、aggregate、missing_data 三类证据范围；行级证据必须有 source_row_id，聚合证据必须有 aggregation_key 和 contributing_count，缺数据证据必须写清缺什么、查过哪里、影响谁、检查时间和中文缺口说明
      - EvidenceLink.source_table 对行级证据必填；聚合证据和缺数据证据可以为空，不能为了凑字段填假表名
      - 页面、导出、错误提示不能显示内部英文枚举、数据库字段名、函数名或内部异常堆栈
      - 新增 Python 代码保持 Python 3.8 语法，不使用 list[X]、dict[K, V]、X | None
      - 实施本条 feature 时必须新增或更新并通过这些测试：PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q tests/schedule/route_view/test_scheduler_plan_identity_evidence_contract.py tests/gantt/test_scheduler_candidate_gantt_plan_role_contract.py
    notes: 后续所有子 feature 的共同读取输入；派工确认和现场反馈写入只在后续专门条目中落地。

  - slug: delay-diagnosis-core-service
    title: 延期诊断核心服务
    description: 新增只读延期诊断服务，把超期事实、最后工序、关键链、资源负荷、停机、齐套状态收成事实、可能线索、证据、缺口和建议动作。
    depends_on: [shared-plan-identity-evidence-contract]
    depends_on_reasons:
      shared-plan-identity-evidence-contract: 延期诊断必须先知道自己诊断的是正式采用方案、对比参考方案还是模拟预览，否则证据链接和页面跳转会串到另一套计划。
    status: done
    feature: 2026-05-27-delay-diagnosis-core-service
    minimal_loop: false
    primary_paths:
      - core/services/scheduler/schedule_delay_diagnosis_service.py
      - core/services/common/overdue_calculations.py
      - core/services/report/report_engine.py
      - core/services/report/downtime_impact.py
      - core/services/report/utilization.py
      - core/services/scheduler/gantt_critical_chain_provider.py
      - core/services/scheduler/gantt_adjustment_validation_service.py
      - data/repositories/batch_repo.py
      - data/repositories/batch_material_repo.py
      - data/repositories/material_repo.py
      - core/services/material/batch_material_service.py
      - tests/scheduler_analysis/test_scheduler_delay_diagnosis_contract.py
      - tests/algorithm/test_due_exclusive_consistency.py
      - tests/gantt/test_gantt_adjustment_validate_simulate.py
    entrypoints:
      - "从本 roadmap 的 5.2 EvidenceLink 和 5.3 延期诊断服务契约开始写 feature-design"
      - "先接 core/services/scheduler/schedule_delay_diagnosis_service.py，只做只读服务"
      - "物料判断必须先看 Batches、BatchMaterials、Material 和批次物料服务能提供什么数据"
    test_commands:
      - "PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q tests/scheduler_analysis/test_scheduler_delay_diagnosis_contract.py tests/algorithm/test_due_exclusive_consistency.py tests/gantt/test_gantt_adjustment_validate_simulate.py"
    forbidden_paths:
      - core/algorithms/
      - installer/
      - vendor/
    exit_checks:
      - diagnose_plan_overdue 和 diagnose_batch 只读，不写 Schedule、ScheduleHistory、候选表或 scenario 表
      - 区分 scheduled_overdue 和 unscheduled_overdue
      - 每条诊断包含 confirmed_facts、candidate_clues、confidence、evidences、data_gaps、suggested_actions、trace_meta
      - confirmed_facts 不能只是字符串列表；每条已确认事实必须包含 text 和至少一条 EvidenceLink，没有证据只能放到 candidate_clues 或 data_gaps
      - suggested_operation_clue、leading_clue_code 和 leading_clue_label 只能表示建议先复核的线索，不能命名为 primary_reason 或页面上的主要原因
      - trace_meta 包含 plan_identity、evidence_count、evidence_sources、rule_version、ranking_inputs、clue_selection_trace、input_fingerprint
      - 关键链只能作为内部线索，页面不能显示 critical_chain 或关键链命中这种术语，只能写建议先复核的工序
      - 第一版物料判断只读 Batches.ready_status / ready_date 和 BatchMaterials 明细；不能承诺库存、采购、在途物料的完整追溯
      - 读取齐套状态时必须明确查过 data/repositories/batch_repo.py、data/repositories/batch_material_repo.py、data/repositories/material_repo.py 和 core/services/material/batch_material_service.py 能提供的字段
      - 没有 BatchMaterials 明细、没有批次齐套状态、或缺现场执行数据时必须输出 data_gaps 或 unknown；不能编造“物料不够导致延期”
      - 候选方案和 scenario 诊断必须使用对应方案行，不能悄悄回到 adopted
      - EvidenceLink 能追到具体来源；行级证据追到来源行，聚合证据写清 aggregation_key 和 contributing_count
      - 新增 Python 代码保持 Python 3.8 语法，不升级破坏 Win7 x64 的依赖
      - 实施本条 feature 时必须新增或更新并通过这些测试：PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q tests/scheduler_analysis/test_scheduler_delay_diagnosis_contract.py tests/algorithm/test_due_exclusive_consistency.py tests/gantt/test_gantt_adjustment_validate_simulate.py
    notes: 第一版不改算法，不做 AI 根因，只做保守解释。

  - slug: delay-diagnosis-overdue-report-entry
    title: 超期清单延期解释入口
    description: 把延期诊断接到超期清单，让每个超期批次显示可能线索、证据等级、建议动作和“查看为什么晚了”入口。
    depends_on: [delay-diagnosis-core-service]
    depends_on_reasons:
      delay-diagnosis-core-service: 超期清单入口只负责展示和导出，必须先有只读诊断服务提供事实、线索、证据和缺口，页面不能自己临时拼原因。
    status: done
    feature: 2026-05-27-delay-diagnosis-overdue-report-entry
    minimal_loop: true
    primary_paths:
      - templates/reports/overdue.html
      - web/routes/reports.py
      - web/routes/report_plan_preview.py
      - web/viewmodels/page_manuals_reports.py
      - core/services/report/report_engine.py
      - core/services/report/exporters/xlsx.py
      - core/services/scheduler/schedule_delay_diagnosis_service.py
      - tests/scheduler_analysis/test_scheduler_delay_diagnosis_contract.py
      - tests/scheduler_analysis/test_report_delay_diagnosis_plain_language.py
      - tests/app_runtime/test_frontend_offline_static_assets.py
      - tests/gantt/test_gantt_degradation_surface.py
      - tests/web_pages/test_dashboard_overdue_count_tolerance.py
    entrypoints:
      - "从 templates/reports/overdue.html 和 web/routes/reports.py 接入超期清单入口"
      - "导出增强走现有 GET /reports/overdue/export，不新增独立导出路由"
      - "页面和导出先说“可能线索、建议复核、证据不足”，不能说系统已经判定根因"
    test_commands:
      - "PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q tests/scheduler_analysis/test_scheduler_delay_diagnosis_contract.py tests/scheduler_analysis/test_report_delay_diagnosis_plain_language.py tests/app_runtime/test_frontend_offline_static_assets.py tests/gantt/test_gantt_degradation_surface.py tests/web_pages/test_dashboard_overdue_count_tolerance.py"
    forbidden_paths:
      - core/algorithms/
      - installer/
      - vendor/
    exit_checks:
      - 超期清单显示晚了多久、建议先复核哪里、证据等级、下一步去哪里看
      - 行内能打开“查看为什么晚了”详情
      - 证据不足时页面明确说当前数据不足，不能确定唯一原因
      - 没有物料数据时不显示“物料不够导致延期”，只显示状态缺失或不判断物料
      - 没有车间反馈前不判断“现场做慢了”
      - 修掉 overdue.html 里 scenario_id 兜底显示；没有模拟方案名称时显示“模拟预览（未命名）”
      - 详情接口和导出必须带 trace_meta；导出文件本身必须包含追溯信息，至少有“诊断依据”工作表或等价追溯信息，不能用“详情接口里有 trace_meta”替代；导出表头必须写成“本次诊断编号”“生成依据摘要”“核对信息”“证据来源”“证据缺口”“生成时间”“筛选条件”等中文大白话，不能把 trace_meta、rule_version、input_fingerprint 原样给用户看，也不能把“诊断规则版本”“输入指纹”作为用户表头
      - 超期导出工作簿里的超期明细工作表必须叫“超期清单”，不能继续用 overdue 这类内部英文名；相关测试也要锁住这个中文工作表名
      - 第一版增强现有 GET /reports/overdue/export；如果当前系统对模拟预览仍拒绝导出，延期诊断导出也保持拒绝，并用中文提示“模拟预览暂不支持导出，请切换到正式采用方案”
      - 同步 web/routes/report_plan_preview.py 里的模拟预览导出拒绝文案、导出筛选条件和导出日志小字段，确保路由层记录的筛选条件能和导出文件里的诊断追溯信息对上
      - 页面、按钮、空状态、错误提示都使用中文大白话，不出现英文原因码、数据库字段名、函数名、内部异常堆栈
      - 新前端资源不走 CDN、外链字体、外链脚本、外链样式，不引入新前端框架或 Chrome 109 不支持能力
      - 新增 Python 代码保持 Python 3.8 语法，不升级破坏 Win7 x64 的依赖
      - 实施本条 feature 时必须新增或更新并通过这些测试：PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q tests/scheduler_analysis/test_scheduler_delay_diagnosis_contract.py tests/scheduler_analysis/test_report_delay_diagnosis_plain_language.py tests/app_runtime/test_frontend_offline_static_assets.py tests/gantt/test_gantt_degradation_surface.py tests/web_pages/test_dashboard_overdue_count_tolerance.py
    notes: 本 roadmap 的最小闭环。做完后用户能从报表看到一条端到端解释链。

  - slug: candidate-recommendation-card
    title: 方案对比推荐结论卡
    description: 在排产优化分析页方案对比区域增加推荐结论卡，用中文说明系统建议采用哪套代表方案、为什么、还有哪些点需要再看。
    depends_on: [shared-plan-identity-evidence-contract]
    depends_on_reasons:
      shared-plan-identity-evidence-contract: 推荐卡必须先复用统一计划身份，才能把正式采用方案和对比参考方案讲清楚，避免用户误以为候选方案已经下发。
    status: done
    feature: 2026-05-27-candidate-recommendation-card
    minimal_loop: false
    primary_paths:
      - web/viewmodels/scheduler_analysis_candidates.py
      - templates/scheduler/analysis_parts/_candidate_comparison.html
      - web/routes/domains/scheduler/scheduler_analysis.py
      - tests/candidate/test_scheduler_candidate_analysis_contract.py
      - tests/candidate/test_scheduler_analysis_candidate_links_and_roles.py
      - tests/candidate/test_scheduler_candidate_plain_language.py
      - tests/app_runtime/test_frontend_offline_static_assets.py
    entrypoints:
      - "从 templates/scheduler/analysis_parts/_candidate_comparison.html 的方案对比区域接推荐结论卡"
      - "只翻译已有 selection_reason_code、候选 label 和推荐结论"
      - "不要在本条里计算三方案差值，差值留给 candidate-summary-delta-cards"
    test_commands:
      - "PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q tests/candidate/test_scheduler_candidate_analysis_contract.py tests/candidate/test_scheduler_analysis_candidate_links_and_roles.py tests/candidate/test_scheduler_candidate_plain_language.py tests/app_runtime/test_frontend_offline_static_assets.py"
    forbidden_paths:
      - core/algorithms/
      - installer/
      - vendor/
    exit_checks:
      - 页面顶部直接显示系统建议采用哪套代表方案
      - 本条只翻译现有 selection_reason_code、候选 label 和推荐结论，不提前计算三方案差值
      - 推荐理由使用中文业务文案，不把 score tuple 当主解释；页面第一眼不能直接显示内部评分串
      - 需要说明代价时只写“详细差值见后续摘要卡”，不偷偷实现下一条摘要差值范围
      - 候选未开启时显示暂无方案对比
      - 候选失败或跳过时显示清楚提示，不把失败候选当可采用方案
      - 页面标清正式采用方案和对比参考方案，不让用户误以为候选已经下发
      - 页面、按钮、空状态、错误提示、导出内容都使用中文大白话，不显示内部英文枚举、数据库字段名、函数名
      - 页面、导出文件名、导出列名、空状态、错误提示、按钮、弹窗、表格表头都不能出现 plan_role、scenario_id、source_table、candidate_id、event_type
      - 新前端资源不走 CDN、外链字体、外链脚本、外链样式，不引入新前端框架或 Chrome 109 不支持能力
      - 新增 Python 代码保持 Python 3.8 语法，不升级破坏 Win7 x64 的依赖
      - 实施本条 feature 时必须新增或更新并通过这些测试：PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q tests/candidate/test_scheduler_candidate_analysis_contract.py tests/candidate/test_scheduler_analysis_candidate_links_and_roles.py tests/candidate/test_scheduler_candidate_plain_language.py tests/app_runtime/test_frontend_offline_static_assets.py
    notes: 第一版只做推荐结论壳和中文解释；差值卡在下一条做。

  - slug: candidate-summary-delta-cards
    title: 代表三方案摘要卡和总指标差值
