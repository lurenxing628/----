roadmap: aps-frontend-workbench
created: 2026-05-31
last_reviewed: 2026-06-01

# 阶段口径：
# - 前 3 条是第一轮 A/B/C：先把上下文合同、顶层入口、首页值班台跑通。
# - 第 3 条 minimal_loop: true，表示做完首页值班台后系统能跑通最窄的端到端工作台路径。
# - 第 4-9 条是第一版完整工作台：分析、甘特详情、资源派工、报表回跳、主流程测试和用户指南。
# - 第 10-13 条是第二阶段增强：延期解释接现场事实、甘特资源负荷摘要、停机影响任务级明细、牵连批次/订单影响面。

items:
  - slug: workbench-context-link-contract
    title: 工作台上下文和跨页链接合同
    description: 建立 WorkbenchPlanContext 和 WorkbenchLink 口径，让首页、甘特、分析、资源派工、报表之间跳转时保持同一版本、方案、日期范围和业务对象。
    depends_on: []
    depends_on_reasons: {}
    status: done
    feature: 2026-06-01-workbench-context-link-contract
    minimal_loop: false
    primary_paths:
      - web/viewmodels/scheduler_workbench_links.py
      - web/viewmodels/scheduler_workbench_link_query.py
      - web/routes/domains/scheduler/scheduler_analysis_links.py
      - web/routes/domains/scheduler/scheduler_resource_dispatch.py
      - web/routes/domains/scheduler/scheduler_resource_dispatch_execution_routes.py
      - core/services/scheduler/resource_dispatch_page_context.py
      - web/viewmodels/scheduler_resource_dispatch.py
      - web/viewmodels/scheduler_resource_dispatch_execution.py
      - tests/regression_scheduler_workbench_links_contract.py
    entrypoints:
      - "新建或整理专门负责生成跨页链接的 ViewModel，不让各页面自己拼 URL"
      - "统一 version、plan_role、scenario_id、date_from/date_to、start_date/end_date、resource_type/resource_id、scope_type/scope_id 等参数翻译"
      - "以页面设计稿第 3.4 节为准，逐路线写清 required_params；资源派工和报表类跳转必须考虑 query_date、period_preset、scope_type"
      - "补内部值到中文展示值映射：plan_role、guardrail_reason_type、resource_type/scope_type、period_preset、view"
      - "用户可见文本只用中文业务名，内部字段只留在 URL/隐藏字段/日志"
      - "非正式方案不能生成现场记录写入入口，也不能下发写入 API URL、Excel 导入 URL、模板下载 URL、表单 action 或 data-* 写入地址"
    test_commands:
      - "PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q tests/regression_scheduler_workbench_links_contract.py"
    forbidden_paths:
      - core/algorithms/
      - schema.sql
      - vendor/
    exit_checks:
      - WorkbenchPlanContext 字段包含版本、方案身份、日期范围、批次、资源、可写状态和中文护栏说明
      - WorkbenchLink 包含 label、url、target_page、context_summary、disabled、disabled_reason、required_params
      - target_page 只使用 dashboard、analysis、gantt、week_plan、resource_dispatch、overdue_report、delay_diagnosis、utilization_report、execution_review、reports_index
      - 合同层支持首页到分析、甘特、资源派工、报表的链接保留版本、方案、日期范围；资源派工和报表类链接还要保留 query_date、period_preset，页面接线按后续阶段继续
      - 分析推荐卡到甘特、超期清单、资源派工的链接不丢 plan_role、scenario_id、日期范围和目标页需要的 view/scope_type
      - 合同层支持甘特任务详情到资源派工和计划实际复盘的链接保留任务定位、资源定位、scope_type 和批次定位，甘特详情接线按后续阶段继续
      - 合同层支持报表明细回甘特或资源派工时保留版本、方案、日期、query_date、period_preset、资源/批次对象，报表回跳入口按后续阶段继续
      - execution_review 只看正式采用方案；非正式方案入口禁用，不把 plan_role/scenario_id 误传成可复盘上下文
      - plan_role、guardrail_reason_type、resource_type/scope_type、period_preset、view 都有内部值到中文展示值映射，页面、导出列、公开 payload 不直接露内部值
      - 模拟预览只显示中文预览名，不把 scenario_id 当页面文案
      - 候选方案、模拟预览、对比参考方案、历史正式方案不会输出任何现场记录写入入口或写入 URL
      - 新增 ViewModel 代码保持 Python 3.8 写法，不使用 int | None、list[str] 等新版类型语法

  - slug: workbench-nav-entry
    title: 顶层计划工作台入口
    description: 把顶层导航里的首页升级为计划工作台入口，让计划员能一跳进入首页值班台、排产分析、甘特图、资源派工、计划和现场实际，承接“前端布局审计第 8 条：顶层入口不清楚”。
    depends_on: [workbench-context-link-contract]
    depends_on_reasons:
      workbench-context-link-contract: 顶层入口需要复用统一链接，避免导航先各自手拼 URL。
    status: done
    feature: 2026-06-01-workbench-nav-entry
    minimal_loop: false
    primary_paths:
      - templates/base.html
      - templates/components/ui_macros.html
      - static/css/ui_contract.css
      - tests/regression_workbench_nav_entry_contract.py
      - tests/regression_frontend_ui_language_polish.py
    entrypoints:
      - "读取 base.html 当前首页、排产、报表等顶层导航"
      - "用本地 HTML/CSS 做计划工作台一跳入口或轻量下拉，不引入外部菜单库"
      - "入口文案使用中文业务名，不显示 plan_role、scenario_id 等内部字段"
    test_commands:
      - "PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q tests/regression_workbench_nav_entry_contract.py tests/regression_frontend_ui_language_polish.py"
    forbidden_paths:
      - core/algorithms/
      - vendor/
      - installer/
    exit_checks:
      - 顶层导航出现“计划工作台”或等价的一跳作业入口
      - 计划工作台入口能到首页值班台、排产分析、设备甘特、人员甘特、资源派工、计划和现场实际
      - 菜单或入口使用本地静态样式，键盘可达，不依赖外部 JS 库
      - 顶层入口不显示内部字段名

  - slug: dashboard-workbench-risk-todos
    title: 首页值班台和今日待处理
    description: 把首页从静态统计卡和入口宫格升级为计划员值班台，显示最新排产风险、今日待处理和下一步入口。
    depends_on: [workbench-context-link-contract, workbench-nav-entry]
    depends_on_reasons:
      workbench-context-link-contract: 首页待处理要生成跨页入口，必须先有统一链接合同。
      workbench-nav-entry: 先确保计划员从顶层能进入工作台，再升级首页内容。
    status: done
    feature: 2026-06-01-dashboard-workbench-risk-todos
    minimal_loop: true
    primary_paths:
      - templates/dashboard.html
      - web/viewmodels/dashboard_workbench.py
      - web/viewmodels/dashboard_workbench_cards.py
      - web/routes/dashboard.py
      - tests/regression_dashboard_workbench_contract.py
      - tests/regression_aps_workbench_first_round_flow_contract.py
      - tests/regression_frontend_ui_language_polish.py
      - tests/regression_manual_entry_scope.py
    entrypoints:
      - "读取 dashboard.html 当前四张统计卡和最近排产区域"
      - "复用排产历史、超期数量、候选方案、现场记录现状，不在模板里临时猜业务规则"
      - "第一版最多展示 6 条今日待处理"
      - "现场情况待确认只统计正式采用方案、当前日期范围内已到计划开始时间且 actual_start_time、actual_end_time、current_status 都还不能说明现场进展的任务，不统计未来任务"
      - "资源负荷阈值固定为 warning >= 75%、danger >= 90%"
    test_commands:
      - "PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q tests/regression_dashboard_workbench_contract.py tests/regression_aps_workbench_first_round_flow_contract.py tests/regression_frontend_ui_language_polish.py tests/regression_manual_entry_scope.py"
    forbidden_paths:
      - core/algorithms/
      - vendor/
      - installer/
    exit_checks:
      - 首页出现今日待处理区域
      - 待处理类型至少覆盖超期批次、方案需要确认、资源负荷偏高、现场情况待确认、基础数据缺口
      - 每类待处理都有默认动作和备用动作，且动作使用 WorkbenchLink 生成
      - 每条待处理都有中文标题、影响说明、证据说明和可点击入口
      - 同一类型多条时按总方案规则只挑最重要一条，并在影响说明里写明数量
      - 资源高负荷待处理说明受影响对象和数据来源；算不出来时显示数据不足，不显示成 0%
      - 反馈人为空不阻断保存、不阻断报表、不作为首页红色风险
      - 首页文案使用“现场情况待确认”或“暂未收到/录入现场情况”，不写成必须补录
      - 第一轮小烟测覆盖顶层进首页、首页跳分析/甘特/资源派工/报表且上下文不丢
      - 第一版如果不保存处理状态，页面明确说明待处理项是实时生成
      - 空状态用中文说明当前没有必须马上处理的风险
      - 页面不显示 plan_role、scenario_id、source_table、candidate_id、op_id、schedule_id
      - 不引入外部前端资源，不使用破坏 Chrome 109 的语法
      - 新增 ViewModel 代码保持 Python 3.8 写法，不使用 int | None、list[str] 等新版类型语法

  - slug: analysis-action-hub-layout
    title: 排产分析行动入口布局
    description: 调整排产分析页层级，把方案推荐、延期解释和诊断建议提到技术过程之前，让用户先看到结论和下一步。
    depends_on: [workbench-context-link-contract]
    depends_on_reasons:
      workbench-context-link-contract: 分析页要生成跳甘特、资源派工、报表的入口，必须先保证跨页上下文不会丢。
    status: done
    feature: 2026-06-01-analysis-action-hub-layout
    minimal_loop: false
    primary_paths:
      - templates/scheduler/analysis.html
      - templates/scheduler/analysis_parts/_candidate_comparison.html
      - templates/scheduler/analysis_parts/_diagnostic_sections.html
      - web/viewmodels/scheduler_analysis_candidates.py
      - web/viewmodels/scheduler_analysis_candidate_helpers.py
      - tests/regression_scheduler_analysis_workbench_layout.py
      - tests/regression_scheduler_candidate_analysis_contract.py
    entrypoints:
      - "保留已有推荐方案卡和三方案摘要，不重算业务规则"
      - "把诊断行动和方案推荐组织成第一屏主信息"
      - "优化过程和趋势图保留但放后面，不抢主入口"
      - "影响面拆清已有字段和新增字段；已有字段先复用，算不出来的新增字段用数据不足说明"
    test_commands:
      - "PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q tests/regression_scheduler_analysis_workbench_layout.py tests/regression_scheduler_candidate_plain_language.py tests/regression_scheduler_candidate_analysis_contract.py"
    forbidden_paths:
      - core/algorithms/
      - schema.sql
      - vendor/
    exit_checks:
      - 选中版本后，页面先显示版本身份、推荐结论、主要风险和下一步按钮
      - 没有候选方案时，显示清楚空状态
      - 推荐方案卡复用已有超期、拖期、工期、换型指标，并对新增影响面字段显示数据不足或补水结果
      - 诊断区继续区分事实、线索和证据不足
      - 链接到甘特、资源派工、超期清单时保留版本和方案上下文
      - 页面不显示内部字段名和内部英文枚举
      - 页面不引入外部前端资源，不使用破坏 Chrome 109 的语法
      - 新增或调整 ViewModel 代码保持 Python 3.8 写法，不使用 int | None、list[str] 等新版类型语法

  - slug: gantt-task-detail-panel
    title: 甘特任务详情区
    description: 在只读甘特图旁边或下方增加稳定任务详情区，点击任务后显示公开字段、超期提示和下一步链接。
    depends_on: [workbench-context-link-contract]
    depends_on_reasons:
      workbench-context-link-contract: 详情区里的下一步入口要跳到同一版本和方案，不能在甘特页局部临时拼 URL。
    status: done
    feature: 2026-06-01-gantt-task-detail-panel
    minimal_loop: false
    primary_paths:
      - templates/scheduler/gantt.html
      - static/js/gantt_render.js
      - static/js/gantt_popup.js
      - static/css/aps_gantt.css
      - tests/regression_gantt_task_detail_panel_contract.py
      - tests/regression_ui_browser_geometry_smoke.py
    entrypoints:
      - "复用甘特 task meta 公开字段；实际开始/结束必须从现场执行状态或事件 provider 接入，不能从 task meta 硬猜"
      - "保留现有弹窗，新详情区作为稳定阅读区域"
      - "窄屏放下方，宽屏可放右侧"
    test_commands:
      - "PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q tests/regression_gantt_task_detail_panel_contract.py"
    forbidden_paths:
      - core/algorithms/
      - static/js/frappe-gantt.min.js
      - vendor/
    exit_checks:
      - 点击甘特任务后，详情区显示批次、图号或物料、工序、资源、计划时间、状态和超期提示
      - 详情区显示计划和实际小结；没有现场记录时用中文说明“暂未记录现场实际”
      - 未选任务时显示“点击甘特条查看任务详情”
      - 详情区不展示 op_id、schedule_id、source_table、scenario_id
      - 当前仍是只读甘特，不开放拖拽写库
      - 页面布局在 1280、1024、768 宽度下不遮挡甘特和筛选控件
      - 页面不引入外部前端资源，不使用破坏 Chrome 109 的语法
      - 新增 ViewModel 代码保持 Python 3.8 写法，不使用 int | None、list[str] 等新版类型语法

  - slug: resource-dispatch-execution-lane
    title: 资源派工执行入口分层
    description: 梳理资源派工页的任务明细、日历矩阵、甘特图、现场记录、计划和现场实际入口，让计划员查看和计划员代录现场事实不互相挤。
    depends_on: [workbench-context-link-contract]
    depends_on_reasons:
      workbench-context-link-contract: 资源派工、计划和现场实际都依赖同一计划上下文，先统一链接后再动页面层级。
    status: planned
    feature: null
    minimal_loop: false
    primary_paths:
      - templates/scheduler/resource_dispatch.html
      - static/js/resource_dispatch_core.js
      - static/js/resource_execution.js
      - web/viewmodels/scheduler_resource_dispatch.py
      - web/viewmodels/scheduler_resource_dispatch_execution.py
      - tests/regression_resource_dispatch_workbench_lane_contract.py
    entrypoints:
      - "先确认 2026-05-29-resource-dispatch-execution-page-extraction 这份未提交设计是否继续作为输入"
      - "保留任务明细、日历矩阵、甘特图、现场记录四个现有入口"
      - "把查看计划和实际作为正式采用方案的复盘入口，不和填写实际情况混在一起"
      - "现场事实区是计划员代录，不是现场员工登录填写"
      - "Excel 继续直接导入，短期不做预览 / 二次确认；导入后只显示新增、失败、跳过数量和错误说明"
    test_commands:
      - "PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q tests/regression_resource_dispatch_workbench_lane_contract.py tests/regression_resource_dispatch_site_records_frontend_contract.py"
    forbidden_paths:
      - core/algorithms/
      - schema.sql
      - vendor/
    exit_checks:
      - 计划员查看排班的入口和计划员代录现场事实入口视觉上分清
      - 查看计划和实际入口清楚说明是复盘，不是写入现场记录
      - 任务卡显示图号或物料信息、计划开始/结束、实际开始/结束和偏差；拿不到字段时显示中文缺口，不显示内部字段
      - 执行流水显示来源和记录时间；后端暂未提供时，feature design 要把缺口写清，不在前端硬编时间
      - 模拟预览、候选方案和对比参考方案下，查看计划和实际入口禁用并给出中文原因
      - 页面可见按钮和隐藏地址都必须以后端 available_actions 或后端下发 URL 为准
      - 候选方案、模拟预览、历史正式方案不能写现场记录
      - 非正式方案下不输出写入按钮、表单 action、API URL、Excel 导入 URL、模板下载 URL 或任何 data-* 写入地址
      - 短期不新增“我的任务”、现场员工账号、班组权限、多人权限模型
      - 暂停、继续、报异常、撤销、审批、扫码、消息推送全部后移；已有暂停/异常字段只作为事实或备注展示，不进入闭环
      - 反馈人短期保持可空，空了不报错，列表里可显示“未填写反馈人”
      - Excel 导入短期不出现预览 / 确认入口
      - 页面、导出列和公开 payload 不泄露内部字段名
      - 页面不引入外部前端资源，不使用破坏 Chrome 109 的语法
      - 新增或调整 ViewModel 代码保持 Python 3.8 写法，不使用 int | None、list[str] 等新版类型语法

  - slug: reports-workbench-backlink
    title: 报表中心和报表明细回跳入口
    description: 把报表中心从报表列表升级为风险入口，并在超期清单、资源负荷、计划和现场实际、停机影响明细里补回甘特、资源派工和复盘的上下文入口。
    depends_on: [workbench-context-link-contract]
    depends_on_reasons:
      workbench-context-link-contract: 报表回跳必须带同一版本、方案、日期范围和资源/批次对象，先统一上下文再补入口。
    status: planned
    feature: null
    minimal_loop: false
    primary_paths:
      - templates/reports/index.html
      - templates/reports/overdue.html
      - templates/reports/utilization.html
      - templates/reports/execution_review.html
      - templates/reports/downtime.html
      - web/viewmodels/scheduler_workbench_links.py
      - web/viewmodels/scheduler_reports_workbench.py
      - tests/regression_reports_workbench_backlink_contract.py
      - tests/regression_ui_browser_geometry_smoke.py
    entrypoints:
      - "报表中心入口卡简短说明每张报表回答什么问题，详情页再展开不能证明什么"
      - "资源负荷设备/人员明细行提供查看排班、定位甘特、查看相关超期入口"
      - "计划和现场实际明细行只按正式采用方案复盘，并提供回资源派工、定位甘特、查看现场记录入口"
      - "超期清单和停机影响继续给上下文回跳，不把报表做成死胡同"
    test_commands:
      - "PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q tests/regression_reports_workbench_backlink_contract.py"
    forbidden_paths:
      - core/algorithms/
      - schema.sql
      - vendor/
