status: approved
source_plan: .codestable/refactors/2026-07-12-algorithms-a3-dependency-decoupling/algorithms-a3-dependency-decoupling-refactor-design.md
scope: algorithms A3 static dependency decoupling with root GreedyScheduler and old import compatibility preserved
excluded_scope:
  - retirement, lazy loading or dynamic replacement of core.algorithms.GreedyScheduler
  - algorithm behavior, ordering, date semantics, resource selection, slot estimation, graph mode or statistics changes
  - core.services.scheduler.graph.ready_queue relocation
  - A4, A5, A6 and tests directory SCC remediation
  - algorithm pluginization, new solvers, database, configuration or UI changes
  - git commit, push, PR creation and clean-HEAD proof without separate authorization
guardrails:
  - core/algorithms/__init__.py remains byte-identical and GreedyScheduler keeps its identity, signatures and __module__
  - core.algorithm_contracts and core.algorithm_runtime never import core.algorithms or core.services and their __init__.py files do not aggregate exports
  - old paths remain available through explicit same-object re-exports; no import star, function-local import, TYPE_CHECKING, dynamic __getattr__ or swallowed error hides a cycle
  - dispatch modules remain canonical execution modules and existing monkeypatch targets must still affect real execution
  - greedy.algo_stats keeps snapshot_algo_stats, merge_algo_stats and deepcopy in the old module while sharing only the approved counter helpers
  - production function callers use canonical leaves where required for callgraph visibility
  - each step is validated before the next starts; unexplained SCC, callable, edge or unresolved drift returns the work to design
  - this checklist approval does not authorize apply, production changes, formal evidence refresh or git history changes
