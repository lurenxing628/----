doc_type: refactor-checklist
refactor: 2026-07-12-foundation-a2-dependency-decoupling
status: approved
source_plan: .codestable/refactors/2026-07-12-foundation-a2-dependency-decoupling/foundation-a2-dependency-decoupling-refactor-design.md
scope: foundation A2 errors/migration common one-way dependency refactor
excluded_scope:
  - operation execution event data contract relocation
  - database schema, SQL, migration versions, defaults, transactions, backup and rollback semantics
  - full replacement of 182 production class-only core.infrastructure.errors imports
  - A3-A6 and tests directory cycles
guardrails:
  - no function-local imports, TYPE_CHECKING, dynamic __getattr__ or swallowed errors used to hide cycles
  - old import paths remain available through one-way explicit re-exports with object identity
  - historical migration files may change import lines only; function bodies and SQL must remain identical
  - error codes, signatures, messages, details, HTTP statuses and JSON structure remain unchanged
  - one step is validated before the next starts
  - git commit, push and PR creation require separate explicit authorization
