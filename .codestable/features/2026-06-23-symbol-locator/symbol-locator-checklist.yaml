feature: 2026-06-23-symbol-locator
created: 2026-06-23

steps:
  - action: "编排骨架:cli + static_index,whereis/callers/callees 读 json 跑通(唯一名),模块进 tools/symbol_locator/ 子包"
    exit_signal: "whereis build_dispatch_key 正确回 file:line;callers/callees 出全量 confident 边"
    status: done
  - action: "计算节点:同名碰撞列 cls/rel 消歧菜单 + callers/callees 标注 ambiguous/dynamic/tests 盲区"
    exit_signal: "whereis to_dict 列 64 处菜单;callers 带盲区提示"
    status: done
  - action: "计算节点:jedi 实时消歧(--at,lazy import,缺失优雅降级)"
    exit_signal: "whereis to_dict --at calendar_admin.py:306 精确命中 WorkCalendar.to_dict;无 jedi 时降级不崩"
    status: done
  - action: "接通加载:freshness 检测产物时间戳,stale 自动 2s 重建,--rebuild 强制"
    exit_signal: "改一个函数后查询命中新行号;输出头显示快照时间"
    status: done
  - action: "计算节点:scip --deep 全量档(读已生成 index.scip + scip print 转倒排查询层,lazy import,缺失降级提示生成命令)"
    exit_signal: "callers resolve_plan --deep 给出含 tests 的全量精确结果"
    status: done
  - action: "钩子落地:新建项目根 CLAUDE.md(A,含 2.3.1 触发关键词清单)+ cs-note 写 attention.md(B),不动全局 cs 技能"
    exit_signal: "新会话/cs 技能启动能看到工具提示与触发词"
    status: done
  - action: "测试覆盖:补齐验收场景清单(含降级路径)"
    exit_signal: "所有验收场景有可观察证据"
    status: done

