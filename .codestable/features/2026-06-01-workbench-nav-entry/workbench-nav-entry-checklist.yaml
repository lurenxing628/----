feature: 2026-06-01-workbench-nav-entry
roadmap: aps-frontend-workbench
roadmap_item: workbench-nav-entry
created: 2026-06-01
steps:
  - id: step-1
    title: 设计与清单落盘
    action: 写入 design/checklist，并把 roadmap item 标成 in-progress。
    exit_signal: feature 文档和 roadmap items YAML 校验通过。
    status: done
  - id: step-2
    title: 导航宏和模板接线
    action: 新增工作台导航宏，并挂到 base.html 顶层导航。
    exit_signal: 静态测试能找到“计划工作台”和 6 个目标入口。
    status: done
  - id: step-3
    title: 样式接线
    action: 补本地 CSS，让工作台菜单在顶层导航里可展开、可换行、文字不挤出。
    exit_signal: CSS 类存在，且没有新增外链资源或 JS 依赖。
    status: done
  - id: step-4
    title: 回归测试
    action: 新增导航合同测试，并运行本阶段指定回归。
    exit_signal: workbench nav contract 和 frontend language polish 测试通过。
    status: done
checks:
  - id: check-1
    title: 顶层入口存在
    source: design 第 3 节关键场景
    expect: 顶层导航能看到“计划工作台”。
    status: passed
  - id: check-2
    title: 六个一跳入口
    source: design 第 3 节关键场景
    expect: 菜单包含首页值班台、排产分析、设备甘特图、人员甘特图、资源派工、计划和现场实际。
    status: passed
  - id: check-3
    title: 甘特视图参数
    source: design 第 3 节关键场景
    expect: 设备甘特图和人员甘特图分别带 view=machine / view=operator。
    status: passed
  - id: check-4
    title: 无写入入口
    source: design 第 1 节明确不做
    expect: 菜单不包含现场记录写入、Excel 导入、模板下载或表单 action。
    status: passed
  - id: check-5
    title: 不露内部字段
    source: design 第 3 节关键场景
    expect: 菜单文案不出现 plan_role、scenario_id、source_table、candidate_id、op_id、schedule_id。
    status: passed
  - id: check-6
    title: 本地静态资源
    source: design 第 2.2 节流程级约束
    expect: 不新增外部 JS/CSS/CDN/字体或前端框架。
    status: passed
