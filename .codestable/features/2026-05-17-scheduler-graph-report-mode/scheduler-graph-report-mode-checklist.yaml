feature: 2026-05-17-scheduler-graph-report-mode
created: 2026-05-17

steps:
  - action: "只读核实：确认阶段 10 蓝本、排产调用链、summary/diagnostics、OperationLogs、图模块能力和测试模板"
    exit_signal: "subagent 只读核实完成，接入点锁定在 schedule_orchestrator 的 validated_schedule_payload 之后、SummaryBuildContext 之前"
    status: done
  - action: "summary 接入：SummaryBuildContext 增加 graph_analysis_public / graph_analysis_diagnostics，并在 summary assembly 写入 algo / diagnostics"
    exit_signal: "public 小摘要进入 algo.graph_analysis，采样诊断进入 diagnostics.graph_analysis，optimizer diagnostics 仍能共存"
    status: done
  - action: "orchestrator 接入：report/on 旁路调用图分析，off 保持零 graph import"
    exit_signal: "off 不导入 graph；report 只读调用 input_adapter、analysis_service、exporter；on 在本阶段输出 report_only"
    status: done
  - action: "OperationLogs 合同：保持现有 algo 小摘要路径，不写完整图对象和 diagnostics"
    exit_signal: "simulate 和正式排产日志都只能看到 public 小摘要，看不到 nodes、edges、raw、node_metrics、topological_order"
    status: done
  - action: "阶段 0 baseline 对比：三组 baseline 在 report 模式下排产结果不变"
    exit_signal: "case_001_normal、case_002_urgent、case_003_external 均通过；只新增 graph_analysis 摘要"
    status: done
  - action: "CodeStable 回填：roadmap、items.yaml、architecture 和 feature acceptance 与真实完成范围一致"
    exit_signal: "PR-2 标 done，PR-3 标 done，feature 记录写明已做、未做、验证和 clean proof 口径"
    status: done

