  - 模拟预览显示正式计划还没有改变，不能确认派工或写现场反馈；没有名称时显示“模拟预览（未命名）”。
  - 页面、公开 JSON、Excel 文件名和工作簿内容不显示 source_table、scenario_id、candidate_id、candidate_rows 等内部字段。
  - 不新增 POST /scheduler/resource-dispatch/confirm，不新增确认派工表，不产生确认派工副作用。
  - 不改 schema.sql、core/algorithms/、installer/、vendor/。
  - 新增 Python 代码通过 Python 3.8 语法风险扫描。
