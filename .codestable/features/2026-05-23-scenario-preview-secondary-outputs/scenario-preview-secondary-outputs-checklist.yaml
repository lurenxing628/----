checks:
  - scenario_id 只能是显式预览身份，不能伪装成 plan_role。
  - 所有数据读取必须先走 resolve_plan_view 或已解析的 plan_resolution。
  - 找不到 Scenario 时必须报错，不能返回正式计划。
  - 页面必须用业务话说明“正式计划还没有改变”。
  - 不写 Schedule/ScheduleHistory/ScheduleVersionSeq/ScheduleCandidate*。
