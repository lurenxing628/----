    evidence: tests/regression_aps_workbench_flow_contract.py、tests/regression_frontend_offline_static_assets.py、tests/regression_scheduler_analysis_diagnostic_graph_score_contract.py、tests/regression_scheduler_workbench_link_guardrails.py、tests/regression_web_silent_fallback_contract.py；本地生成全景图按 .gitignore 和测试排除规则跳过，不作为正式用户文档扫描输入，诊断页重点影响样本不再把内部 op_id 拼成“工序 N”，摘要解析失败不再把 json_decode_error 拼进普通页面，周计划未知结果状态和未知策略不直接显示 raw code；候选方案坏指标显示“记录异常 / 无法安全对比”，优化过程和诊断区不再把 True/False 当 1/0 展示。
  - id: check-8
