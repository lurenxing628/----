feature: 2026-06-02-workbench-flow-regression-suite
roadmap: aps-frontend-workbench
roadmap_item: workbench-flow-regression-suite
created: 2026-06-02
steps:
  - id: step-1
    title: 测试骨架
    action: 新增主流程测试文件，复用首页建库和 HTML 解析思路跑通一条“首页到目标页”路径。
    exit_signal: 测试能打开首页并访问至少一个目标页。
    status: done
  - id: step-2
    title: 主流程断言
    action: 补齐分析、甘特、资源派工、超期清单、资源负荷、计划和现场实际的上下文和中文信号断言。
    exit_signal: 第一版主流程所有路线都有版本、方案、日期、批次或资源上下文证据。
    status: done
  - id: step-3
    title: 护栏断言
    action: 补护栏断言，并对断言暴露的正式方案身份、历史版本显示、写入口禁用缺口做最小正式修复。
    exit_signal: 不可写上下文不会生成可点击复盘或写入地址，页面可见文本不露内部字段。
    status: done
  - id: step-4
    title: 几何登记
    action: 补工作台关键页面路径和稳定信号，保持真实浏览器探针职责不变。
    exit_signal: 几何合同测试能证明关键路径已登记。
    status: done
  - id: step-5
    title: 门禁登记
    action: 把新测试加入 required registry 和 scheduler required regression group。
    exit_signal: registry 合同测试证明新测试会被质量门禁覆盖。
    status: done
  - id: step-6
    title: 验证收口
    action: 运行本 feature 指定 pytest、registry 合同、几何 HTML 合同，并做一次 dirty quality gate 预跑。
    exit_signal: 指定测试通过；dirty quality gate 只证明命令链能跑完，最终绑定证明留到拆分提交后的 clean gate。
    status: done
checks:
  - id: check-1
    title: 范围守护
    source: 范围守护
    expect: 只做测试体系和已承诺护栏缺口的最小生产修复；不改算法、外部依赖、第二阶段增强，不把浏览器烟测塞进 required tests。schema 语义只允许触碰 OperationExecutionEvents 身份、状态和迁移合同。
    status: passed
    evidence: git diff --name-only 覆盖工作台上下文、链接护栏、页面模板、测试登记、schema.sql 及 v15/v16/v18/v19 迁移；schema 语义变更限于现场记录事件身份、事件状态组合、事件时间格式、坏历史事件 fail-fast、组合外键分组和状态修订号唯一性，schema.sql 保持 495 行且不再一行塞两个 CREATE INDEX；未包含依赖清单或算法实现文件；.drift-cache 只忽略语义雷达机器缓存，.playwright-cli 只忽略浏览器工具本地快照，二者都不隐藏 .codestable/audits / .codestable/checkup 证据。
  - id: check-2
    title: 主流程起点
    source: 验收场景
    expect: 首页显示计划工作台、首页值班台和今日待处理，并能找到第一版主流程入口。
    status: passed
    evidence: tests/regression_aps_workbench_flow_contract.py 和 tests/regression_dashboard_workbench_contract.py 覆盖首页入口。
  - id: check-3
    title: 上下文不丢
    source: 编排骨架
    expect: 首页到分析、甘特、资源派工、报表和复盘时保留版本、方案、日期、批次或资源上下文。
    status: passed
    evidence: tests/regression_scheduler_workbench_links_contract.py、tests/regression_reports_workbench_backlink_contract.py。
  - id: check-4
    title: 甘特双视角
    source: 验收场景
    expect: 设备甘特使用 view=machine，人员甘特使用 view=operator，并显示任务详情区。
    status: passed
    evidence: tests/regression_gantt_task_detail_panel_contract.py 和 tests/regression_gantt_task_detail_js_contract.py。
  - id: check-5
    title: 报表明细回跳
    source: 验收场景
    expect: 报表明细行回甘特或资源派工时保留批次或资源上下文，不扩大成全量。
    status: passed
    evidence: tests/regression_reports_workbench_backlink_contract.py、tests/regression_reports_workbench_navigation_contract.py。
  - id: check-6
    title: 非正式复盘禁用
    source: 流程级约束
    expect: 非正式、历史、坏摘要、空明细、候选或模拟方案下计划和现场实际入口禁用或回到可用版本，并给中文原因。
    status: passed
    evidence: tests/regression_scheduler_plan_identity_summary_guardrail.py、tests/regression_web_silent_fallback_contract.py、tests/regression_scheduler_workbench_link_guardrails.py、tests/regression_scheduler_historical_plan_label_contract.py；资源派工、工作台链接和报表计划状态统一走 web/viewmodels/scheduler_plan_guardrail_messages.py，把 result_summary_parse_reason / schedule_result_status 翻成公开中文，不把 json_decode_error 或 failed 直接显示给用户；周计划版本下拉和所选版本摘要只显示已有中文状态标签或“结果状态未知”，不 raw fallback 到 result_status；所选版本排产方式由 route 补 strategy_display_label，模板不再 raw fallback 到 strategy。
